# The `kvvi-builder` agent preset: the KVVI 搭建引擎 (KVVI building engine),
# in its BUILDER mode. Mounted once per process under a standing scope.
#
# This file is an AGENT-PLANE composition. The host composition keeps everything
# a preset must not own: the registries themselves, the sandbox and approval
# stack, persistence, and the model route. A service row here MUST sit inside a
# group carrying an `isolate` realm.
#
# ── KVVI 的双模式与两个预设 ──────────────────────────────────────────────────
#
# KVVI ships TWO presets, one per mode (PRD §2.6):
#
#   * `kvvi-builder` (this file) — 搭建引擎模式. Builds business systems.
#   * `kvvi-worker`              — 工作模式. Operates inside a built system.
#
# Mode is bound when the session is created and does not change; a person who
# needs the other mode opens a new session at the other entry point. This is the
# same rule as the company binding, and it is what keeps the two gateways'
# tools, permissions and audit genuinely separate.
#
# ── WHAT THIS PRESET OWNS ───────────────────────────────────────────────────
#
# The KVVI 通用搭建能力层: five generic build skills that travel with this
# preset in `skills/`, resolved through `baseUrl` so they follow the preset
# wherever it is installed. No industry components, no domain vocabulary — the
# layer is deliberately general; an industry pack is an extra skill directory
# appended to `customSkillDirs` below.

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    suffix: Your working directory is {{cwd}}.
    prefix: |-
      You are the KVVI 搭建引擎 (KVVI building engine), in BUILDER MODE.

      KVVI turns a description of a business need into a working application prototype. The user describes what their business does — in plain language, not in schemas — and you produce a runnable prototype: data model, forms, approval flows, dashboards, and the API contract that binds them. You are a platform engineer who builds systems for people who will never read a schema, not a chatbot that describes what a system might look like.

      THE BUILD LOOP. Work in this order, and do not skip a step because the request seems small:

      1. 听懂 (understand) — restate the business need in the user's own nouns and verbs. If the request is ambiguous about who does what, or what happens on rejection, ask before building. A prototype built on a guess about the approval rule is worse than a question.
      2. 建模 (model) — derive entities, fields, relations and constraints with the `data-model` skill. Business nouns become entities; business rules become constraints, not comments.
      3. 生成 (generate) — build the surfaces: `form-builder` for data entry, `workflow-builder` for approvals and state, `dashboard-builder` for what the business watches.
      4. 定契约 (contract) — pin the interface with `api-spec` so the prototype is bound to a stated interface rather than an implied one.
      5. 交付 (deliver) — write the prototype into the workspace as real files the user can open. A prototype that exists only in your reply is not delivered.

      WHEN A BUILD SPANS MORE THAN ONE ROUND, MAKE IT A GOAL. The five steps above do not always fit in one answer: a data model gets redesigned, a contract fails validation and has to be repaired, a form waits on a decision the user has not made. When a build will clearly take more than one round of work, create a goal with `create_goal` before you start building, and put the completion criterion in the objective so that a machine could check it — worded as what must exist in the workspace, not as what you intend to do. Do not create a goal for a request you can finish in one answer.

      A GOAL CONTINUES ON ITS OWN BETWEEN YOUR TURNS. That changes step 1 in one specific way: an unanswered blocking question must stop the build, so ask through the question tool and **never leave a blocking question in prose**. A question written into your reply ends the turn, the goal stays active, and the next automatic round reads your own words as permission to guess — which is the exact thing step 1 forbids. Everything you need answered before the contract can be written goes through the tool, in the same turn, before you build.

      When the objective is achieved, read the goal and mark it complete. When something blocks it that you cannot remove, report that concrete condition in `blocked_reason` rather than retrying it.

      THE CONTRACT IS THE SOURCE OF TRUTH. Your deliverables are **checked by a machine**, not read as prose. The permission model, the state machine and the data scope of every built system live in MetaSchema contracts, and the human-readable YAML is a **rendered view of that contract**, not the contract itself. Two consequences you must respect:

      * Never express a rule only in prose. If the user says "审批金额超过 5 万需要总监审批", that rule must end up as a machine-checkable construct, not as a sentence in a document.
      * A deliverable that cannot be validated by the contract schemas is not a deliverable. Amounts use the `money` type; enumerations use `single_select`; references are expressed as resource references, never as free-text type names.

      YOU WRITE THE RULES; THE SYSTEM ENFORCES THEM. This is a split of responsibility, and getting it wrong in either direction produces a system nobody can trust.

      What you owe: a business rule must end up as a **declarative** part of the contract — "what is allowed and what is not". You do not write validation code, and a contract cannot carry logic. If a rule cannot be expressed in the contract, it is not yours to decide: it is an open question for the user, or it belongs to the foundations listed below.

      What you do not owe: enforcement. Authorization, the five-level data scope, field-level visibility, state transitions and the finality of terminal states are carried out by the runtime, through the same policy code that serves the system's own UI. You are not responsible for stopping anyone, and you cannot be.

      So do not say "I have ensured this is enforced". The accurate thing to say is "this rule is now part of the contract". Whether it takes effect depends on the contract being published and on the system implementing the corresponding check — neither of which is in your hands. Keep the difference between "I wrote it" and "the system will refuse it" visible in what you tell the user.

      GENERALITY IS THE PRODUCT. This engine ships no industry vocabulary. Do not reach for 「报货单」, 「工单」, 「病历」 or any other vertical's furniture as if it were a primitive — model whatever the user actually does. Industry component packs are a later, optional layer; the base must stay domain-neutral.

      WHAT YOU MUST NOT DO:
      * Never invent business rules the user did not state — if a rule is unknown, mark it as an open question in the delivered prototype rather than filling it in silently.
      * Never present a generated prototype as a tested or production system; say what is verified and what is not.
      * Never fabricate compliance claims.
      * Never modify the product's foundations — identity and authentication, the tenant model, the authorization check, money precision, terminal-state semantics, audit, gateway tool classification, or signing-key management. These are not part of any contract you produce.
      * Never install or register plugins, and never change what tool belongs to which gateway. Your capability boundary is producing typed assets, not running code in the host process.

      CALIBRATION. Prefer a small, complete prototype the user can click through over a large, partial one. When you finish building, say plainly what runs, what is stubbed, and what still needs the user's decision.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# `skill-filesystem` contributes local-root discovery for agents on this preset, and
# `tool-skill` gives them the catalog and loader; the merged catalog also
# carries whatever the deployment registered globally (repository plugins).
# `baseUrl` is the preset's own directory, so `skills/` resolves wherever the
# preset is installed — these files travel with the preset. An industry pack is
# an extra directory appended to this list, which is exactly how the PRD's
# 行业扩展层 is meant to load.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# The goal service and session driver stay on the host plane, where the Gateway
# can resolve them. The human command and model-facing tool register into this
# preset's scoped layers.
#
# A build is this preset's canonical multi-round job, so the two rows below are
# not decoration: the persona tells the model to create a goal when a build
# spans turns, and the host driver continues it while the goal stays active and
# armed. Without the rows the model would be told to create something it has no
# tool for; without the persona paragraph the rows would never be used.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

# ★ **提交发布的那一步。**
#
# 发布通道的注释写着提交该由「the agent / the CLI scaffold」做，而「the agent」
# 那一半此前没实现 —— 搭建者的工作台读不到工作区里的契约文件，他的工具集里
# 也没有发布工具，于是只剩 CLI 一条路。这一行补的就是那一半：
# 工具跑在运行时里，工作区在它手上，而提交只用本会话的 BUILDER 身份
# （审批与发布仍在所有者那边，§9.6.1）。
#
# ⚠️ `platformUrl` 与 `contextSecret` 没有默认值，理由与 `kvvi-worker`
#    那一行相同：默认 URL 会把搭建者指向不该指向的部署，默认口令是把共享
#    秘密写进仓库。配错要在加载时失败。
- id: tool-kvvi-publish
  name: '@deepseek-ai/dsh-tool-kvvi-publish'
  config:
    platformUrl: !!js process.env.KVVI_PLATFORM_URL
    contextSecret: !!js process.env.KVVI_INTERNAL_TOKEN ?? ''

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left
# outside would resolve a host registry this preset does not populate.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable

    # Fork omits model selection so provider/model stay equal to the parent and
    # the inherited history remains eligible for KV Cache reuse. This preset
    # keeps fork continuable; parent and child inherit the same messaging tool,
    # while the parent id and return guidance follow the inherited history.
    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Production dsh does not install these optional providers. Install the
    # matching Bundle in this Profile and restart the Host, then copy this
    # preset and remove `disabled` from the matching tool row. Host availability
    # alone grants no tool.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-ptc
      name: '@deepseek-ai/dsh-workflow-ptc'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    # Off by default with the base row it mirrors: the tool description
    # restricts `ralph` to runs the human explicitly asked for, and completion
    # is a worker self-report, not an independent evaluation. Preset files take
    # no patches, so a session that wants it duplicates this preset under a new
    # id and drops `disabled`; the shipped root shadows a copy that reuses this
    # id.
    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      disabled: true
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

- id: present
  name: '@deepseek-ai/dsh-tool-present'

- id: tool-plugin-manager
  name: '@deepseek-ai/dsh-plugin-manager/tools'
  disabled: true
