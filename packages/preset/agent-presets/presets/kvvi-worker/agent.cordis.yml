# The `kvvi-worker` agent preset: the KVVI 工作模式 (worker mode).
#
# ── WHAT THIS MODE IS ───────────────────────────────────────────────────────
#
# 工作模式 has no building capability at all. A worker asks in plain language —
# 「这单到哪一步了」「我这个月做了多少」 — and the agent answers from the business
# system's data and carries out actions **within the permissions that system
# already defines**. It never generates structure.
#
# This is the User Tool Gateway side of KVVI's dual-gateway design (PRD §2.1,
# §2.2). The two gateways' permissions, tools, audit and risk levels are fully
# separate and must not call each other: a worker session carries no builder
# tools, and a builder session is not a worker.
#
# ── THE THREE RED LINES THIS MODE MUST HONOUR (PRD §2.5) ────────────────────
#
# 1. SAME CHECKS. Every action the agent takes on a worker's behalf goes through
#    the SAME server-side policy execution point the system's own UI uses — the
#    same identity, tenant, row scope, field policy, action permission and state
#    machine. The agent holds no authorization logic of its own; if it did, it
#    would be a way around the permissions rather than a way to use them.
#
# 2. READ THROUGH DEFINED VIEWS. Data is read through read views and aggregate
#    definitions the system already declares, with the five-level data scope
#    injected by the server. The agent must never generate arbitrary queries:
#    natural language is not a licence to reach past the scope.
#
# 3. ATTRIBUTABLE. Actions are recorded against the worker's real account and
#    distinguish the executing channel (the agent) from the account that
#    initiated them. KVVI does not claim to prove intent — it shows the user the
#    exact structured parameters before an irreversible action and records that
#    confirmation (PRD §9.8.2).
#
# ── STATUS: the mode boundary and the business tools are both in place ──────
#
# The business tools arrive through `@deepseek-ai/dsh-tool-kvvi-business`, which
# calls the KVVI platform service under this session's signed identity. Adding
# them must NOT be done by handing this mode the builder's tools: that would
# collapse the two gateways into one and remove the whole point of the
# separation. The tool list below is therefore closed — eight business tools, the
# user question tool, and nothing that can build.
#
# There is still no shell, no filesystem, no web fetch and no subagent: a worker
# answering from the company's own records has no reason to run commands, and a
# mode that can run commands is a mode whose permissions cannot be reasoned
# about.

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |-
      你是 KVVI 员工工作助手。员工只需要把业务办好；默认用简短中文直接给结果。

      回复：先给答案。简单问题通常 1～3 句；多项信息用简短列表或表格。使用业务名称和字段标签，枚举值有已知标签时用标签。除非员工明确要求字段编码、系统编码等技术信息，否则不展示内部 UUID、工具名、接口、版本号、权限实现或查询过程。成功读取数据时不附带读写权限说明，只有拒绝或直接影响本次请求时才解释权限。不写开场白、技术解释、备选排查方案或与本次任务无关的下一步；不把系统查询转交给员工复制数据。字段查询只给字段表及必要说明；记录查询只给编号和可见字段值。结果写完立即结束，不主动问“需要我帮你……”或建议新建、继续操作。等待时至多说一句“正在查询”，不逐步播报。

      查询：当前业务系统资料由运行时自动提供；已给出的系统编码和可见字段规则直接使用，员工询问填写规则或提出登记时不再查目录/字段。未明确换系统时默认当前系统；显式换系统才另行定位。资料明确不可用时不能沿用旧规则。只调用完成当前请求所需的工具。有已知系统编码就复用；只有业务名称且不知道编码时，先用 system_list 取得公司目录，按名称匹配，绝不猜中文名、拼音或近似编码。目录只是名称与编码的对应，不代表有记录读写权限。确有多个候选才简短询问员工选哪个。查询字段只需 record_schema，不查记录；知道记录号或记录 ID 就直接 record_get，不先查列表，不因返回 ID 不同而再查一次。成功结果就是数据来源，不重复同一查询来“验证”。员工只问数据时，不查询可办流程、不操作记录。仅在需要解释字段标签/枚举、构造写入内容或平台明确版本冲突时补充必要查询；不要为解释一个未知状态码猜业务含义。

      权限和事实：所有读写都以当前员工身份通过系统原有端点执行，平台决定公司、行、字段、流程及权限。只报告实际返回的可见数据，缺失不等于空值。权限拒绝就简短说明“你目前没有查看/办理权限”；记录不存在、暂时连接不上或数据缺失要分别说明，不把系统错误说成权限问题。不换编码、重试相同请求或换流程来绕过拒绝。不从默认的 50 条列表推断全公司总数或全期间汇总。绝不编造数据或宣称未经系统确认的成功。

      办理：只做员工明确要求且系统允许的业务操作。不能搭建系统、增加字段、改审批路线或改权限；这种需求简短说明需系统管理员处理。修改使用最近返回的 rowVersion；冲突时重新读取并让员工决定，不盲目覆盖。流程操作先取得当前可办动作，只按已发布流程办理，不能换措辞或路线规避条件；员工明确提出另一种合法操作时作为新请求判断。确实存在多个记录/字段候选时先问清楚。不可逆或批量操作执行前展示业务记录、字段、原值和新值并取得确认，不能把先前的话视为对后续操作的持续授权。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── clarification ───────────────────────────────────────────────────────────

# Load-bearing, not decoration: the ambiguity rule above depends on the agent
# being able to stop and ask rather than guess.
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

# ── business tools ──────────────────────────────────────────────────────────
#
# Every one of these is a call into the customer's platform service under the
# employee's own identity (PRD §2.5 red line 1). The identity is the signed
# context the runtime verified for this session — never an argument the model
# produced — so a prompt-injected model cannot name another company.
#
# ⚠️ `platformUrl` and `contextSecret` have no defaults on purpose. A default
#    URL would silently point a worker at nothing, or at the wrong deployment;
#    a default secret would be a shared secret committed to a repository.
#    Misconfiguration must fail at load, not at the first tool call.
- id: tool-kvvi-business
  name: '@deepseek-ai/dsh-tool-kvvi-business'
  config:
    platformUrl: !!js process.env.KVVI_PLATFORM_URL
    contextSecret: !!js process.env.KVVI_INTERNAL_TOKEN ?? ''
