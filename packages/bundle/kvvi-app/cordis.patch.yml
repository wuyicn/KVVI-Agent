# The KVVI application bundle patch: the layer KVVI stacks OVER `dsh-web-app`.
#
# ── WHY THIS FILE IS SHORT ──────────────────────────────────────────────────
#
# Bundles stack in `dsh.profile.bundles` order: app-boot applies each bundle's
# patch list over the previous one, so a bundle here adds to the layers beneath
# it rather than replacing them. KVVI keeps every row `dsh-base` and
# `dsh-web-app` mount — the whole Web surface stays available — and this file
# carries only what KVVI itself contributes.
#
# That is deliberate. Copying dsh-web-app's rows into a KVVI bundle would fork
# the Web composition: every upstream change to that surface would then have to
# be hand-ported, and the copies would silently drift. Stacking keeps KVVI's
# delta equal to what KVVI actually owns.
#
# Pruning rows is therefore NOT how KVVI removes a capability it does not want.
# Hiding an entry point is done by occupying the slot it renders into. Actual
# pruning waits until the dependencies between upstream rows have been measured;
# until then a removed row can fail silently rather than loudly.

- insert:
    # KVVI's mode binding: one signed identity per request, one fixed agent preset
    # per gateway (`USER` → `kvvi-worker`, `BUILDER` → `kvvi-builder`).
    #
    # ⚠️ **WHY THIS ROW IS HERE AND NOT IN A PRESET.** It is the row that decides
    # *which* preset a session may load, so it cannot live inside a preset: a
    # preset is mounted after the choice has already been made. It belongs to the
    # host plane, next to the other rows `dsh-base`/`dsh-web-app` mount.
    #
    # ⚠️ **WHY IT MUST NOT BE OMITTED.** It was, and the product's core loop did
    # not work. Without this row nothing rewrites `SessionCreateRequest`, so the
    # preset the *client* asked for wins — every session ran `standard`, the
    # `kvvi-builder` and `kvvi-worker` presets were never selected, and the
    # builder's agent had no build skills at all. It is also the whole server-side
    # half of PRD §2.6 (mode bound at session creation) and of §9.6.5 anchor ①
    # (an employee never reaches the building engine): the client can ask for any
    # preset, and this row is what refuses it.
    #
    # `secret` is the same value the platform signs its `x-kvvi-*` headers with.
    # An empty one throws at construction — deliberately, because a router that
    # verifies nothing is worse than no router: the requests would still pass,
    # and every downstream reader would believe they had been checked.
    - id: kvvi-mode-router
      name: '@deepseek-ai/dsh-host-kvvi-mode-router'
      config:
        secret: !!js process.env.KVVI_INTERNAL_TOKEN ?? ''
    # KVVI's own brand occupants for the sidebar's brand slots.
    #
    # Upstream's `ui-brand-official` fills the same two slots but registers only
    # when `DSH_CLIENT_BUILD_PROFILE === 'official'`. KVVI's builds do not set
    # that profile, so those slots are unfilled and this row takes them — which
    # is why the KVVI brand requires no edit to any upstream source file.
    - id: kvvi-brand
      name: '@deepseek-ai/dsh-client-kvvi-brand'
    # KVVI's own business panel: a sidebar entry plus an overlay page
    # (pending approvals, systems, permissions, aggregates). It fills two
    # `list` slots declared by upstream (`sidebar.footer.action` from
    # ui-sidebar, `shell.overlay` from ui-layout), so it appends rather than
    # replaces and needs no upstream source edit.
    - id: kvvi-panel
      name: '@deepseek-ai/dsh-client-kvvi-panel'

# ⚠️ A patch **replaces the targeted row's whole `config`**, it does not merge
# into it (`dsh-base`'s patch header says so). `goal` has exactly one config
# field, so restating it here is safe — and that fact is the reason this stays
# a two-line change instead of a copy of upstream's row.
#
# Why bound it at all: the harness default is 256 rounds, and a goal round is
# admitted whenever the agent goes idle while the goal is active and armed. A
# builder goal that can never be satisfied — a typo'd success criterion, a
# validator that is not installed, a contract the model keeps failing — would
# therefore run unattended for 256 rounds before anything stopped it. A build is
# a bounded piece of work, not an open-ended agent run; 24 rounds is generous
# for one and small enough that a stuck loop is noticed.
- id: goal
  config:
    defaultMaxGoalRounds: 24
