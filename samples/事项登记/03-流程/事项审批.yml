# 03 · 流程 / 事项审批（workflow-builder 产物）
# 绑定实体：事项（见 01-数据模型.yml）
# 原则：审批流 = 状态机 + 人。状态机定「能去哪」（在 01 里），本文件定「谁能推」。

流程: 事项审批
绑定实体: 事项
触发: 申请人提交事项（草稿|已驳回 → 待审批）
前置: 01-数据模型.yml 的状态机必须先定好，本文件只把迁移落到具体人

节点:
  - { id: n1, 类型: 开始, 名称: 申请人提交, 触发: "提交审批动作" }
  - { id: n2, 类型: 审批, 名称: 主管审批, 审批人: { 策略: 发起人直属主管, 解析: "申请人.直属主管id" }, 收敛: 或签, 可填意见: 是, 驳回需填意见: 是, 说明: "一级审批（假设 A5）" }
  - { id: n3, 类型: 自动动作, 名称: 置为已通过, 动作: "置状态=已通过; 记录审批完成时间=now(); 写审批记录(动作=通过); 通知申请人" }
  - { id: n4, 类型: 结束, 名称: 流程通过, 终态: 已通过 }
  - { id: n5, 类型: 自动动作, 名称: 置为已驳回, 动作: "置状态=已驳回; 记录审批完成时间=now(); 写审批记录(动作=驳回, 意见=必填); 通知申请人" }
  - { id: n6, 类型: 结束, 名称: 流程驳回, 终态: 已驳回 }
  - { id: n7, 类型: 结束, 名称: 兜底结束, 终态: "挂起（待管理员处理）", 说明: "仅在审批人解析失败时进入" }

边:
  - { 从: n1, 到: n2 }
  - { 从: n2, 结果: 通过, 到: n3 }
  - { 从: n2, 结果: 驳回, 到: n5, 目标态: 已驳回, 需填意见: 是, 说明: "驳回目标态显式声明 —— 不是草稿，保留驳回痕迹" }
  - { 从: n3, 到: n4 }
  - { 从: n5, 到: n6 }
  - { 从: n2, 结果: "审批人解析失败", 到: n7 }

驳回目标态: |
  待审批 ──主管驳回（必填意见）──▶ 已驳回
  已驳回 ──申请人修改后重新提交──▶ 待审批（回到 n1 重新解析审批人）

  「已驳回」是一个可停留、可修改、可重提的状态，不是终点也不是草稿。
  重新提交时 提交时间 被覆盖，审批完成时间 置空 —— 旧值在审批记录里可追溯。

审批人解析:
  策略: 发起人直属主管（跟着组织关系走，不写死人名）
  解析: "事项.申请人id → 员工.直属主管id → 校验该主管 在职状态 == 在职"
  快照: "提交时解析并写入 事项.当前审批人id（见 Q11：组织变更不追溯历史事项）"
  多人: "本原型模型为单个直属主管；若 Q1 确认存在多主管，收敛方式默认或签"

收敛方式:
  默认: 或签（任一人通过即通过）
  本流程: "n2 为或签"
  未使用会签: "会签会让流程卡在最后一人；若 Q1 确认存在多主管且业务要求多方确认，再显式改为会签"

兜底:
  审批人解析失败: "转交管理员并告警，流程挂起（终态=挂起），不静默卡住"
  触发条件:
    - "申请人没有直属主管（顶层员工）"
    - "直属主管已离职"
    - "主管记录缺失或引用失效"
  告警对象: 系统管理员（渠道见 Q10）
  说明: "卡住的流程无人知道要处理，是审批系统最隐蔽的故障"

撤回:
  支持: 否
  理由: "原话未提；原型默认不支持撤回，见 00-需求.md Q8。若需要，建议限定为「仅在 待审批 且 主管未处理前」，撤回目标态回到 草稿"

超时:
  配置:
    - { 时长: 48h, 动作: 提醒, 对象: 当前审批人 }
    - { 时长: 72h, 动作: 升级至上级, 对象: "当前审批人的直属主管" }
  不做自动通过:
    理由: "自动通过会在主管未查看时误批，风险高于待办堆积；若业务确需，须显式确认（Q7）"
  状态: "默认值，未经需求方确认 —— 见 Q7"

转交:
  支持: 否
  说明: "原话未提，见 Q9；主管请假场景当前依赖 超时升级 与 兜底 处理"

权限与可见性:
  谁能发起: "在职员工本人"
  审批节点谁能操作: "解析后确定的当前审批人；同角色他人不可代为操作"
  非参与者可见性: "申请人可查看自己事项的进度与审批意见；他人不可见（返回 404）"
  审批意见可见: "申请人与审批人可见；管理员可见"

测试用例:
  - 场景: 正常路径（提交→通过）
    输入: "标题=设备报修，内容=三楼空调不制冷，申请人=张三（主管=李四）"
    期望路径: "n1 → n2 → n3 → n4"
    期望结果: "状态=已通过；审批记录 = [提交(张三), 通过(李四)]；审批完成时间非空"
  - 场景: 驳回路径
    输入: "同上，李四驳回，意见=信息不全，请补充设备编号"
    期望路径: "n1 → n2 → n5 → n6"
    期望结果: "状态=已驳回；最近审批意见=「信息不全，请补充设备编号」；审批记录含驳回条目"
  - 场景: 驳回后重新提交
    输入: "张三补充内容后重新提交"
    期望路径: "n1 → n2 → n3 → n4（第二轮到 n2）"
    期望结果: "状态最终=已通过；审批记录按时间升序含 提交→驳回→提交→通过 四条；提交时间为最后一次"
  - 场景: 边界 · 自审拦截
    输入: "张三自己就是自己的主管（脏数据），张三审批自己的事项"
    期望路径: "n2 拒绝"
    期望结果: "返回 422（错误码 self_approval_forbidden）；不产生审批记录；状态保持 待审批"
  - 场景: 边界 · 审批人解析失败
    输入: "申请人无直属主管，或主管已离职"
    期望路径: "n1 → n2(解析失败) → n7"
    期望结果: "流程挂起，告警管理员；状态不静默停留在 待审批 而无提示"
  - 场景: 边界 · 并发重复审批
    输入: "同一主管对同一事项连续两次点「通过」"
    期望路径: "n2 第一次命中；第二次状态已非 待审批"
    期望结果: "第二次幂等返回 200 同一结果，不写第二条审批记录"
  - 场景: 边界 · 并发双人（若 Q1 为多主管）
    输入: "两位审批人同时通过/驳回"
    期望结果: "只有第一个动作生效（乐观并发/版本号），第二个返回 409 状态已变更"

边界值策略: "本流程无条件分支节点，因此不存在 > / >= 的金额阈值争议；若 Q6 引入多级审批与阈值，必须为阈值本身单列一条边界用例"

待确认:
  - "Q5: 已通过 之后是否还有迁移（撤销/关闭）"
  - "Q6: 是否需要多级审批或条件分支（引入后需重画节点图与阈值边界用例）"
  - "Q7: 超时时长与动作"
  - "Q8: 撤回"
  - "Q9: 转交"
  - "Q10: 通知渠道"
