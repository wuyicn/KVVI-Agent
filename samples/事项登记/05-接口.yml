# 05 · 接口契约（api-spec 产物）
# 原则：状态是结果，不是入参。每个状态迁移一个动作端点，禁止用 PATCH 直接改 状态。

资源: 事项
路径: /事项
鉴权: "Bearer token（登录态）；鉴权与授权分开——能登录 ≠ 能做这个操作"
授权: "A9 数据范围：申请人可创建与修改自己的；当前审批人可对本人待办做动作；他人只读不可见（404）"
并发: "所有写接口带 If-Match（事项.版本号）；不匹配返回 409"
幂等: "有副作用的接口（创建、提交、通过、驳回）必须带 Idempotency-Key，重复请求返回首次结果"
时间格式: "ISO 8601 带时区，例 2026-09-21T13:00:00+08:00"
金额约定: "本资源无金额字段。若后续引入（Q2），一律整数分并在字段文档写明单位"

接口:
  - 方法: GET
    路径: /事项
    说明: 分页列表
    权限: "只返回当前用户可见范围（A9）"
    查询: { 状态: enum, 申请人id: ref, 当前审批人id: ref, 提交时间起: datetime, 提交时间止: datetime, 游标: string, 每页: "integer=20, 上限 100" }
    排序: "提交时间 降序, id 兜底（稳定排序, 避免翻页重复或漏）"
    响应:
      200: { 数据: "array<事项摘要>", 分页: { 下一页游标: string, 是否有更多: boolean } }
    备注: "包一层 {数据,分页}，不返回裸数组——裸数组以后加不了分页元信息"

  - 方法: GET
    路径: /事项/{id}
    说明: 单条详情
    权限: "可见范围内"
    响应:
      200: 事项详情
      404: "不存在 或 无权看到（不区分）"

  - 方法: POST
    路径: /事项
    说明: 创建事项（草稿态）
    权限: "在职员工本人"
    幂等: "Idempotency-Key 必填"
    请求:
      申请人id: { 类型: string, 必填: 是, 说明: "由服务端从登录态填入, 客户端传入值须与登录态一致, 否则 422" }
      标题:     { 类型: string, 必填: 是, 约束: "1-100" }
      内容说明: { 类型: text,   必填: 是, 约束: "1-2000" }
      附件:     { 类型: "array<file>", 必填: 否, 约束: "≤3 个, 单个 ≤10MB" }
    响应:
      201: { id: string, 单号: string, 状态: 草稿, 版本号: integer, 创建时间: datetime }
      422: 错误体

  - 方法: PATCH
    路径: /事项/{id}
    说明: 部分更新业务字段（**不含 状态**）
    权限: 申请人本人
    前置: "状态 ∈ {草稿, 已驳回}，否则 409"
    幂等: "Idempotency-Key 必填；重复提交同一版本号的相同内容返回首次结果，不重复累加版本号"
    请求头: { If-Match: "版本号", Idempotency-Key: string }
    请求: { 标题: string, 内容说明: text, 附件: "array<file>", 版本号: integer }
    响应:
      200: 事项详情
      409: "版本冲突 或 状态不允许修改"
      422: 错误体

  - 方法: POST
    路径: /事项/{id}/提交
    说明: "提交审批：草稿|已驳回 → 待审批。服务端解析并快照 当前审批人id"
    权限: 申请人本人
    前置: "状态 ∈ {草稿, 已驳回}"
    幂等: "Idempotency-Key 必填；已在 待审批 时重复调用返回 200 同一结果，不写第二条记录"
    请求: { 修改说明: { 类型: text, 必填: 否, 说明: "重新提交时可带一句改了什么" } }
    响应:
      200: 事项详情
      409: "状态已变更"
      422: "字段校验失败；或审批人解析失败（错误码 approver_unresolved，已告警管理员）"

  - 方法: POST
    路径: /事项/{id}/通过
    说明: "审批通过：待审批 → 已通过。服务端按状态机决定迁移"
    权限: "当前待审批人本人（且 != 申请人）"
    前置: "状态 == 待审批"
    幂等: "已通过时重复调用返回 200 同一结果，不重复写审批记录"
    请求: { 意见: { 类型: text, 必填: 否, 约束: "≤500" } }
    响应:
      200: 事项详情
      409: "状态已变更（并发）"
      422: "禁止自审（错误码 self_approval_forbidden）"

  - 方法: POST
    路径: /事项/{id}/驳回
    说明: "审批驳回：待审批 → 已驳回。驳回目标态显式=已驳回，申请人可修改后重新提交"
    权限: "当前待审批人本人（且 != 申请人）"
    前置: "状态 == 待审批"
    幂等: "Idempotency-Key 必填；已是 已驳回 时重复调用返回 200 同一结果"
    请求: { 意见: { 类型: text, 必填: 是, 约束: "1-500", 说明: "驳回理由，进入审批记录" } }
    响应:
      200: 事项详情
      409: "状态已变更（并发）"
      422: "意见为空（错误码 rejection_reason_required）"

  - 方法: GET
    路径: /事项/{id}/审批记录
    说明: 审批时间线
    权限: "事项可见范围内"
    响应:
      200: { 数据: "array<审批记录>", 分页: { 下一页游标: string } }
    备注: "记录 append-only，无 POST/PATCH/DELETE 端点——审计记录不提供写入口"

  - 方法: DELETE
    路径: /事项/{id}
    说明: 删除事项（软删除）
    权限: 申请人本人
    前置: "状态 == 草稿，否则 409"
    幂等: "软删除，天然幂等；重复调用返回 204 同一结果"
    响应:
      204: "无内容"
      409: "非草稿状态不可删除"

  - 方法: POST
    路径: /事项/{id}/撤回
    说明: "**未实现**——原话未提撤回，见 Q8。契约预留，服务端返回 501"
    幂等: "当前未实现。实现时须幂等：重复撤回返回 200 同一结果，不重复改状态"
    响应:
      501: "错误码 not_implemented"

资源: 审批记录
路径: /事项/{id}/审批记录
写入口: "无（append-only，仅由动作端点内部写入）"

错误体:
  错误码: string
  消息: string
  字段错误: "array<{ 字段: string, 原因: string }>（仅校验失败时）"
  追踪id: string
说明: "统一错误体，一个形状覆盖所有失败；追踪id 必须返回，用于对日志"

错误码表:
  - { 错误码: validation_failed,          HTTP: 400, 含义: "请求体不是合法 JSON" }
  - { 错误码: unauthenticated,            HTTP: 401, 含义: "无凭据或凭据过期" }
  - { 错误码: forbidden,                  HTTP: 403, 含义: "认证通过但该操作不允许（仅用于无歧义的全局操作）" }
  - { 错误码: not_found,                  HTTP: 404, 含义: "不存在 或 无权看到（刻意不区分，避免探测 id）" }
  - { 错误码: version_conflict,           HTTP: 409, 含义: "版本号不匹配或状态已变更" }
  - { 错误码: invalid_state_transition,   HTTP: 409, 含义: "当前状态不允许该动作" }
  - { 错误码: self_approval_forbidden,    HTTP: 422, 含义: "不能审批自己提交的事项" }
  - { 错误码: rejection_reason_required,  HTTP: 422, 含义: "驳回必须填写理由" }
  - { 错误码: approver_unresolved,        HTTP: 422, 含义: "无法解析审批人，已转交管理员并告警" }
  - { 错误码: rate_limited,               HTTP: 429, 含义: "频率超限，响应带 Retry-After" }
  - { 错误码: internal_error,             HTTP: 500, 含义: "服务端错误，必须返回追踪id" }
  - { 错误码: not_implemented,            HTTP: 501, 含义: "契约预留但未实现（撤回）" }

演示样例:
  提交审批:
    请求: "POST /事项/sx_01H.../提交  Idempotency-Key: 7f3c...  If-Match: 1"
    响应: |
      {
        "id": "sx_01H...",
        "单号": "SX-20260921-0001",
        "状态": "待审批",
        "当前审批人id": "emp_li4",
        "提交时间": "2026-09-21T13:00:00+08:00",
        "版本号": 2
      }
  驳回:
    请求: "POST /事项/sx_01H.../驳回  { \"意见\": \"信息不全，请补充设备编号\" }"
    响应: "{ \"状态\": \"已驳回\", \"最近审批意见\": \"信息不全，请补充设备编号\", \"审批完成时间\": \"2026-09-21T15:30:00+08:00\" }"

机器可读契约: 05-接口.openapi.yaml

