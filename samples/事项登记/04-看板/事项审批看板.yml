# 04 · 看板 / 事项审批看板（dashboard-builder 产物）
# 原则：看板是让人做决定的地方，不是把数据画成图的地方。
#       每放一个图表都要能回答：看到它之后，人会做什么？

看板: 事项审批看板
服务的决定: "主管判断今天要先处理哪些待办、管理员判断审批是否积压、员工判断自己的事项走到哪了"

筛选器:
  列表:
    - { 名: 时间范围, 默认: 最近30天, 可自定义: 是, 说明: "按 提交时间 过滤" }
    - { 名: 组织,     默认: 当前用户可见范围, 说明: "不是全部；按 A9 的数据范围" }
    - { 名: 状态,     默认: "排除草稿（草稿尚不是业务事项）", 可多选: 是 }
    - { 名: 审批人,   默认: "当前用户", 可多选: 是, 备注: "无部门实体（Q12），组织维度以审批人替代" }
  状态可分享: "筛选器状态须反映在 URL 查询参数里，否则用户无法把「我看到的那一屏」发给同事"

图表:
  # 指标卡在上（现在怎么样）
  - type: 指标卡
    标题: 待我审批
    指标: { 聚合: count, 字段: 事项id, 口径: "状态=待审批 且 当前审批人id=当前用户；按提交时间倒序无影响；单位 条" }
    对比: 昨日同期
    空值: 显示 0
    看到之后的动作: "点进去逐条审批，或转交（暂不支持转交，见 Q9）"

  - type: 指标卡
    标题: 平均审批时长
    指标: { 聚合: "avg(审批完成时间 - 提交时间)", 字段: "事项", 口径: "统计区间内状态 ∈ {已通过, 已驳回} 的事项；按提交时间归期；单位 小时；保留 1 位小数" }
    对比: 上一周期
    空值: "无已办结事项时显示「暂无数据」，不显示 0（0 会被误读为「秒批」）"

  - type: 指标卡
    标题: 本期通过率
    指标: { 聚合: "已通过 / (已通过 + 已驳回)", 字段: 事项, 口径: "分母只含已办结事项，不含待审批与草稿；按提交时间归期；排除已删除；单位 %" }
    对比: 上一周期
    空值: "分母为 0 时显示「—」，不显示 0%"
    备注: "口径必须随图表展示（hover 或脚注），否则会上数字会打架"

  # 趋势图在中（怎么变的）
  - type: 折线图
    标题: 近30天提交与办结趋势
    x: { 字段: 提交日期, 粒度: 天 }
    y:
      - { 序列: 提交量, 聚合: count, 字段: 事项id }
      - { 序列: 办结量, 聚合: count, 字段: "审批完成时间非空的事项", 口径: "按 审批完成时间 归日（不是提交时间）" }
    空值: 显示为 0
    看到之后的动作: "判断积压是否在扩大——提交线持续高于办结线时提示需要加审批人力"

  # 明细排查在下（具体是谁）
  - type: 横向条形图
    标题: 各审批人待办积压
    维度: 审批人
    值: { 聚合: count, 字段: 事项id, 口径: "状态=待审批，按 当前审批人id 分组" }
    排序: 降序
    空值: "无待办的主管不显示（不是显示 0）——「没有待办」和「有 0 条待办」含义不同"
    小样本抑制: "组内待办 <3 条时不单独显示，合并为「其他」"
    看到之后的动作: "找出积压最多的人，了解是否请假或权限配置有误"

  - type: 表格
    标题: 待审批事项明细
    字段: [单号, 标题, 申请人, 提交时间, 已等待时长, 当前审批人]
    排序: "已等待时长 降序（最久的排最前，这是要立刻处理的那条）"
    口径: "状态=待审批；排除已删除"
    默认行数: 20
    看到之后的动作: "直接点单号进入审批表单处理最久的一条"

权限:
  继承: "A9 数据权限，不得绕过"
  规则:
    - "员工：只看自己作为 申请人 的事项"
    - "主管：看自己作为 当前审批人 的事项 + 自己提交的事项"
    - "管理员：全部"
  小样本抑制: "聚合分组人数/事项数过少时抑制显示，避免聚合结果反推明细（越权泄露路径）"
  导出: "需单独授权——导出等于把明细带走"
  无权访问: "返回 404 而非 403，避免通过状态码探测 id 是否存在"

布局:
  说明: "最重要的指标在左上（视线起点）；一屏 4-6 个图表；指标卡在上、趋势在中、明细在下"
  排布:
    - { 位置: "左上", 图表: 待我审批 }
    - { 位置: "中上", 图表: 平均审批时长 }
    - { 位置: "右上", 图表: 本期通过率 }
    - { 位置: "中",   图表: 近30天提交与办结趋势 }
    - { 位置: "左下", 图表: 各审批人待办积压 }
    - { 位置: "下",   图表: 待审批事项明细 }
  图表标题: "说问题不说字段名——「各审批人待办积压」而非 approver_pending_count"

待确认:
  - "Q12: 是否需要按部门统计（需要则模型须补 部门 实体）"
  - "Q5: 已通过后是否有 已关闭/已撤销 状态需要纳入口径"
  - "Q7: 超时指标是否要单独展示（积压超 48h 的事项数）"
