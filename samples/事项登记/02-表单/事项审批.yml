# 02 · 表单 / 事项审批（form-builder 产物）
# 实体：事项 + 审批记录（见 01-数据模型.yml）
# 填写人：当前审批人（申请人直属主管）
# 说明：审批不是「改状态」，是两个动作端点。表单上表现为两个按钮 + 一个条件必填的意见框。

表单: 事项审批
实体: 事项
填写人: 当前审批人（申请人直属主管）
前置: 01-数据模型.yml；流程定义见 03-流程/事项审批.yml

只读区:
  说明: 审批人需要先看清「批的是什么、谁提的、等了多久」，再决定
  字段:
    - { 名: 单号,       类型: string,   只读: 是, 来源: 系统 }
    - { 名: 标题,       类型: string,   只读: 是, 来源: 用户 }
    - { 名: 内容说明,   类型: text,     只读: 是, 来源: 用户 }
    - { 名: 附件,       类型: array<file>, 只读: 是, 来源: 用户, 备注: "可下载查看" }
    - { 名: 申请人,     类型: ref(员工), 只读: 是, 来源: 系统 }
    - { 名: 提交时间,   类型: datetime, 只读: 是, 来源: 系统 }
    - { 名: 已等待时长, 类型: string,   只读: 是, 来源: "计算：now() - 提交时间", 备注: "推动主管尽快处理" }

分组:
  - 标题: 审批决定
    字段:
      - { 名: 决定, 类型: "enum[通过,驳回]", 控件: 单选按钮组, 必填: 是, 备注: "仅 2 项，用单选按钮组，不用下拉" }
      - { 名: 意见, 类型: text,            控件: 多行文本, 必填: "见条件显隐", 校验: "长度 1-500", 占位: "驳回时请说明理由，便于申请人修改" }

条件显隐:
  字段规则:
    - { 字段: 意见, 显隐: "决定 == 驳回", 必填: "当可见时必填（1-500 字）", 备注: "假设 A6：驳回必须给理由" }
    - { 字段: 意见, 显隐: "决定 == 通过", 必填: 否, 备注: "通过时意见选填" }
  规则:
    - "从「通过」切到「驳回」时意见框出现并转为必填；从「驳回」切回「通过」时，已填意见保留（对通过无副作用），但若用户未填过则为空"
    - "隐藏字段的旧值清空，避免带着用户看不见的内容提交"

禁用规则:
  规则:
    - { 场景: "状态 != 待审批", 动作: "整表禁用，提示「该事项已处理或已变更」", 备注: "并发保护：别人已批过就不能再批" }
    - { 场景: "当前用户 != 当前审批人id", 动作: "不显示本表单（无权操作；接口返回 404 而非 403，避免探测）" }
  说明: "「只读」与「禁用」语义不同——本表单上方的 单号/申请人/提交时间 是只读（值有意义、会提交、只是不能改）；决定与意见在非待审批状态下是禁用（该状态不适用、灰显且不提交）。不用只读冒充禁用。"

校验:
  即时:
    时机: 失焦即校验
    规则:
      - { 字段: 意见, 规则: "驳回时 1-500 字", 消息: "驳回理由请填 1-500 个字" }
  提交:
    时机: 点提交时 —— 一次性列出全部问题
    规则:
      - { 规则: "决定已选", 消息: "请先选择通过或驳回" }
      - { 规则: "决定=驳回 时意见非空", 消息: "驳回时必须填写理由，否则申请人不知道要改什么" }
      - { 规则: "决策期间状态未变", 消息: "该事项刚被处理过，请刷新查看最新状态", 备注: "乐观并发" }
  服务端:
    时机: 落库前 —— 客户端校验只为准，不作数
    规则:
      - { 规则: "当前用户 == 当前审批人id", 消息: "你没有这条事项的审批权限" }
      - { 规则: "操作人 != 申请人（禁止自审）", 消息: "不能审批自己提交的事项" }
      - { 规则: "状态仍为 待审批", 消息: "该事项状态已变更，本次审批未生效" }
  错误呈现: "一次性列全；消息说怎么改"

提交动作:
  按钮:
    - { 名称: 通过, 结果: "POST /事项/{id}/通过；状态→已通过；写审批记录（动作=通过）" }
    - { 名称: 驳回, 可用条件: "意见非空", 结果: "POST /事项/{id}/驳回；状态→已驳回；写审批记录（动作=驳回，含意见）" }
  服务端动作:
    - "按状态机执行 待审批 → 已通过 / 已驳回；服务端决定状态怎么变，客户端不得传状态"
    - "写入 审批完成时间 与 最近审批意见"
    - "应通知申请人（渠道未定，见 Q10，桩掉）"
  成功后: "返回列表，提示「已通过」或「已驳回，已通知申请人」"
  幂等: "两个端点均须幂等：已通过时重复调用返回 200 同一结果，不重复写审批记录"

待确认:
  - "Q8: 提交后在主管处理前能否撤回"
  - "Q9: 主管能否转交他人审批"
