# 02 · 表单 / 事项登记（form-builder 产物）
# 实体：事项（见 01-数据模型.yml）
# 填写人：员工（申请人）
# 原则：表单是模型的可写视图，不是模型的复述。
#       字段顺序、分组、显隐、校验都由「填写人的动作」决定，不由表结构决定。

表单: 事项登记
实体: 事项
填写人: 申请人（员工本人）
前置: 01-数据模型.yml（字段全部来自模型，无临时字段）

分组:
  - 标题: 事项信息
    说明: 按填写人的思考顺序排——先说是什么事，再补细节
    字段:
      - { 名: 标题,     类型: string, 控件: 单行输入, 必填: 是, 校验: "长度 1-100", 占位: "一句话说清要登记的事" }
      - { 名: 内容说明, 类型: text,   控件: 多行文本, 必填: 是, 校验: "长度 1-2000", 备注: "超过约 100 字用多行（本字段上限 2000，故用多行）" }

  - 标题: 附件
    说明: 假设 A1；原话未提，可在 99-交付说明.md 中按 Q2 决定是否保留
    字段:
      - { 名: 附件, 类型: array<file>, 控件: 文件上传, 必填: 否, 校验: "最多 3 个; 单个 ≤10MB; 允许 pdf/png/jpg/docx", 备注: "上传中显示进度; 失败可单个重试" }

只读区:
  说明: 系统生成字段不进表单，但在只读区展示，让人确认自己提交的是什么
  字段:
    - { 名: 单号,     类型: string,   只读: 是, 来源: 系统, 备注: "首次保存后生成" }
    - { 名: 申请人,   类型: ref(员工), 只读: 是, 来源: "登录态" }
    - { 名: 状态,     类型: enum,     只读: 是, 来源: 系统 }
    - { 名: 提交时间, 类型: datetime, 只读: 是, 来源: 系统, 备注: "未提交时不显示" }

条件显隐:
  字段规则:
    - { 字段: 最近审批意见, 显隐: "状态 == 已驳回", 只读: 是, 必填: 否, 备注: "展示上一轮驳回理由，帮助申请人知道改什么" }
    - { 字段: 附件,        显隐: "始终可见", 必填: 否 }
  规则:
    - "隐藏字段的旧值必须清空后再提交，否则会带着用户看不见的脏数据落库"
    - "显隐规则可反向验证：从最终提交的数据能推出当时哪些字段可见"

禁用规则:
  规则:
    - { 场景: "状态 == 已通过", 动作: "整表禁用（只读查看）", 备注: "已通过为终态，见 Q5" }
    - { 场景: "状态 == 待审批", 动作: "禁用 标题/内容说明/附件，仅允许查看", 备注: "审批中不可改，避免审批的依据被换掉" }
    - { 场景: "状态 == 已驳回 / 草稿", 动作: "可编辑" }
  说明: "「只读」与「禁用」语义不同——只读的值有意义且会提交（如单号），禁用的字段灰显且不提交。不用只读冒充禁用。"

校验:
  即时:
    时机: 失焦即校验 —— 填写人能立刻改
    规则:
      - { 字段: 标题,     规则: "长度 1-100",    消息: "标题请填 1-100 个字" }
      - { 字段: 内容说明, 规则: "长度 1-2000",   消息: "内容说明请填 1-2000 个字" }
      - { 字段: 附件,     规则: "格式与大小",     消息: "单个附件不能超过 10MB，仅支持 pdf/png/jpg/docx" }
  提交:
    时机: 点提交时 —— 一次性列出全部问题，不逐个报
    规则:
      - { 规则: "标题非空",     消息: "请填写标题" }
      - { 规则: "内容说明非空", 消息: "请填写内容说明" }
      - { 规则: "附件数 ≤3",    消息: "附件最多 3 个，请先删除多余的附件" }
      - { 规则: "标题与内容说明未在提交期间被他人改动", 消息: "这条事项已被更新，请刷新后重试", 备注: "乐观并发" }
  服务端:
    时机: 落库前 —— 客户端校验只为准，不作数
    规则:
      - { 规则: "申请人存在且在职",       消息: "当前账号不可提交，请联系管理员" }
      - { 规则: "直属主管可解析且在职",   消息: "无法确定你的主管，已转交管理员处理", 备注: "兜底见 03-流程" }
      - { 规则: "状态允许修改",           消息: "该事项当前状态不可修改" }
      - { 规则: "版本号匹配",             消息: "这条事项刚被更新过，请刷新后重试" }
  错误呈现: "提交时一次性列出所有错误，不逐个报；每条消息说清怎么改，不说「校验失败」"

提交动作:
  按钮:
    - { 名称: 保存草稿, 可用条件: "状态 ∈ {草稿, 已驳回}", 结果: "状态=草稿，不进入审批" }
    - { 名称: 提交审批, 可用条件: "状态 ∈ {草稿, 已驳回}", 结果: "状态=待审批，解析并写入当前审批人" }
  服务端动作:
    - "提交审批：按状态机 草稿|已驳回 → 待审批；写审批记录（动作=提交）；快照当前审批人id"
    - "应通知主管（通知渠道未定，见 Q10，本原型桩掉）"
  成功后: "跳转事项详情页，提示「已提交，等待主管审批」"
  幂等: "提交审批端点须幂等（Idempotency-Key），重复点击不产生第二条审批记录"

待确认:
  - "Q2: 是否需要 分类 / 优先级 / 期望完成时间 / 金额 等字段"
  - "Q4: 是否需要 保存草稿"
  - "A1: 附件是否为真实需求"
