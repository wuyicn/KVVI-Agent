# 01 · 数据模型（data-model 产物）
# 依据：00-需求.md
# 地位：表单是它的可写视图，审批流是它的状态迁移，看板是它的聚合读视图。
#       本文件错了，下游三样全错。

模型: 事项登记
版本: 0.1.0
依据: 00-需求.md

约定:
  - 金额: 本模型不含金额字段。原话未提及任何金额；若后续引入，一律用整数「分」，禁用 float。
  - 时间: 一律 ISO 8601 带时区，例 2026-09-21T13:00:00+08:00；禁用本地化字符串。
  - 主键: id 为不透明字符串，客户端不得解析其结构。
  - 枚举: 所有「审批/通过/驳回」语义一律用状态枚举表达，不用布尔字段
         —— 布尔无法表达「驳回后重新提交」。

实体:

  # ─────────────────────────────────────────────────────────────
  - 名: 员工
    说明: 事项的提交人与审批人。本原型不维护组织架构，仅承载审批人解析所需的引用关系。
    字段:
      - { 名: id,         类型: string,        必填: 是, 来源: 系统, 说明: 不透明字符串 }
      - { 名: 姓名,       类型: string,        必填: 是, 来源: 用户, 约束: "长度 1-50" }
      - { 名: 工号,       类型: string,        必填: 是, 来源: 用户, 约束: "唯一, 长度 1-32" }
      - { 名: 直属主管id,  类型: ref(员工),     必填: 否, 来源: 外部系统, 说明: "可空——顶层员工（如总经理）无主管；来源见 00-需求.md Q1" }
      - { 名: 在职状态,    类型: "enum[在职,离职]", 必填: 是, 来源: 外部系统, 约束: "默认 在职" }
    关系:
      - { 名: 直属主管, 类型: 引用(自引用), 目标: 员工, 基数: 多对一, 建模: "存对方 id, 不复制姓名" }
      - { 名: 提交的事项, 类型: 一对多, 目标: 事项, 反向字段: 申请人id }
      - { 名: 待审批的事项, 类型: 一对多, 目标: 事项, 反向字段: 当前审批人id }
    不变量:
      - "直属主管不能是员工本人（不能自己当自己的主管）"
      - "直属主管链不能成环：A→B→A 非法"
      - "只有在职员工可以成为审批人；解析到离职主管走兜底（见 03-流程）"
    待确认:
      - "Q1: 主管关系的数据来源；一个员工是否可能有多个主管"

  # ─────────────────────────────────────────────────────────────
  - 名: 事项
    说明: 一次登记事项的完整生命周期记录。本系统的核心实体。
    字段:
      - { 名: id,           类型: string,  必填: 是, 来源: 系统, 说明: 不透明字符串 }
      - { 名: 单号,         类型: string,  必填: 是, 来源: 系统, 约束: "唯一, 格式 SX-YYYYMMDD-NNNN", 说明: "给人看与口头报号用；生成后不变" }
      - { 名: 标题,         类型: string,  必填: 是, 来源: 用户, 约束: "长度 1-100" }
      - { 名: 内容说明,     类型: text,    必填: 是, 来源: 用户, 约束: "长度 1-2000" }
      - { 名: 附件,         类型: array<file>, 必填: 否, 来源: 用户, 约束: "最多 3 个, 单个 ≤10MB, pdf/png/jpg/docx", 说明: "假设 A1" }
      - { 名: 申请人id,     类型: ref(员工), 必填: 是, 来源: 系统, 说明: "取自登录态, 不由用户填写" }
      - { 名: 状态,         类型: "enum[草稿,待审批,已通过,已驳回]", 必填: 是, 来源: 系统, 约束: "默认 草稿" }
      - { 名: 当前审批人id,  类型: ref(员工), 必填: 否, 来源: 系统, 说明: "提交时解析直属主管并快照写入；用于待办查询；见 Q11" }
      - { 名: 提交时间,     类型: datetime, 必填: 否, 来源: 系统, 说明: "每次提交/重新提交覆盖；历史值保留在审批记录" }
      - { 名: 审批完成时间,  类型: datetime, 必填: 否, 来源: 系统, 说明: "通过或驳回时写入; 重新提交时置空" }
      - { 名: 最近审批意见,  类型: text,    必填: 否, 来源: 系统, 说明: "只读冗余, 来自审批记录最后一条; 便于列表展示" }
      - { 名: 创建时间,     类型: datetime, 必填: 是, 来源: 系统 }
      - { 名: 更新时间,     类型: datetime, 必填: 是, 来源: 系统 }
      - { 名: 版本号,       类型: integer, 必填: 是, 来源: 系统, 约束: "默认 1, 每次成功写入 +1", 说明: "乐观并发控制, 见 05-接口.yml" }
    关系:
      - { 名: 审批记录, 类型: 一对多, 目标: 审批记录, 建模: "子表持 事项id" }
      - { 名: 申请人,   类型: 引用, 目标: 员工, 建模: "存申请人id" }
    状态机:
      - 从: 草稿
        到: 待审批
        触发: 申请人提交
        允许者: 申请人本人
        前置条件: "标题、内容说明非空且符合长度约束"
        字段变更: { 状态: 待审批, 提交时间: "now()", 当前审批人id: "解析(申请人.直属主管)", 审批完成时间: null }
        审批记录: "是（动作=提交）"
      - 从: 待审批
        到: 已通过
        触发: 主管通过
        允许者: "当前审批人id 对应的员工"
        前置条件: "状态必须仍为 待审批（并发保护）"
        字段变更: { 状态: 已通过, 审批完成时间: "now()", 最近审批意见: "意见" }
        审批记录: "是（动作=通过, 意见选填）"
      - 从: 待审批
        到: 已驳回
        触发: 主管驳回
        允许者: "当前审批人id 对应的员工"
        前置条件: "意见非空"
        字段变更: { 状态: 已驳回, 审批完成时间: "now()", 最近审批意见: "意见" }
        审批记录: "是（动作=驳回, 意见必填）"
      - 从: 已驳回
        到: 待审批
        触发: 申请人修改后重新提交
        允许者: 申请人本人
        前置条件: "标题、内容说明非空；重新解析审批人"
        字段变更: { 状态: 待审批, 提交时间: "now()", 审批完成时间: null, 当前审批人id: "解析(申请人.直属主管)" }
        审批记录: "是（动作=提交, 意见可带修改说明）"
      - 从: 草稿
        到: "已删除（软删除）"
        触发: 申请人删除
        允许者: 申请人本人
        字段变更: { 状态: "已删除（软删标记）" }
        审批记录: "否"
    终态:
      - "已通过 —— 原话未提撤销/关闭，见 Q5"
      - "已删除"
    不变量:
      - "状态为 待审批 / 已通过 / 已驳回 的事项，必须至少有一条对应审批记录"
      - "状态为 已通过 / 已驳回 时，审批完成时间 必须非空"
      - "审批动作的操作人不能是申请人本人（禁止自审）"
      - "仅 草稿 与 已驳回 状态允许修改 标题 / 内容说明 / 附件"
      - "同一员工可以有多条事项，不设唯一约束（原话未限制）"
      - "重新提交时 提交时间 被覆盖，旧值只能在审批记录里追溯"
      - "附件数量 ≤3、单个 ≤10MB 由服务端校验，客户端校验不作数"
    待确认:
      - "Q2: 是否需要 分类 / 优先级 / 期望完成时间 / 关联项目 / 金额 等字段"
      - "Q4: 是否需要 草稿 状态（假设 A3）"
      - "Q5: 已通过 是否为终态；是否需要 撤销 / 关闭 / 归档"

  # ─────────────────────────────────────────────────────────────
  - 名: 审批记录
    说明: 每一次审批动作的不可变审计记录。回答「谁、在什么时候、以什么理由、把事项推到了哪个状态」。
    字段:
      - { 名: id,         类型: string,      必填: 是, 来源: 系统 }
      - { 名: 事项id,     类型: ref(事项),    必填: 是, 来源: 系统 }
      - { 名: 动作,       类型: "enum[提交,通过,驳回]", 必填: 是, 来源: 系统 }
      - { 名: 操作人id,    类型: ref(员工),    必填: 是, 来源: 系统 }
      - { 名: 操作人角色,  类型: "enum[申请人,审批人]", 必填: 是, 来源: 系统 }
      - { 名: 意见,       类型: text,        必填: 否, 来源: 用户, 约束: "驳回时必填, 长度 1-500；通过时选填" }
      - { 名: 动作时间,    类型: datetime,    必填: 是, 来源: 系统 }
    关系:
      - { 名: 所属事项, 类型: 引用, 目标: 事项, 建模: "存 事项id" }
    不变量:
      - "append-only：审批记录不可更新、不可删除"
      - "驳回动作的 意见 必须非空"
      - "同一事项的记录按 动作时间 升序即为其生命周期时间线"
    待确认:
      - "Q9: 转交审批是否要留记录（当前不支持转交）"

# ────────────────────────────────────────────────────────────────
状态机总览: |
  草稿 ──申请人提交──▶ 待审批 ──主管通过──▶ 已通过（终态）
   ▲                    │
   │                    └──主管驳回（必填意见）──▶ 已驳回
   │                                                  │
   └──────────────── 申请人修改后重新提交 ◀────────────┘

  注：驳回目标态是「已驳回」，不是「草稿」—— 保留驳回痕迹，
      申请人从「已驳回」直接重新提交。见 00-需求.md Q3。

# ────────────────────────────────────────────────────────────────
交接:
  - "可写实体 事项 → 02-表单/事项登记.yml"
  - "审批动作输入 → 02-表单/事项审批.yml"
  - "状态机 → 03-流程/事项审批.yml"
  - "聚合读视图（待办、通过率、停留时长）→ 04-看板/事项审批看板.yml"
  - "跨系统边界 → 05-接口.yml"
