# KVVI 原型 | 01 数据模型
# 业务：前台为到访人员登记，登记后被访人确认接待，被访人可拒绝（须填原因）。
# 说明：本文件只写用户陈述过的名词、动词与规则。用户未陈述的一律不写，
#       集中列在文件末尾「待确认」，同步记录于 99-交付说明.md。

元信息:
  原型: 来访登记
  版本: 0.1.0
  状态: 设计稿（未实现、未测试）

# ---------------------------------------------------------------- 实体
实体:
  - 名: 来访登记
    说明: 一次来访从登记到离场的完整生命周期记录。每条有独立身份，有生命周期。
    字段:
      - { 名: id,         类型: string,          必填: 是, 来源: 系统, 说明: 不透明字符串，前端不得解析其结构 }
      - { 名: 登记单号,    类型: string,          必填: 是, 来源: 系统, 约束: "生成规则待确认；示例 V-20260921-0007" }
      - { 名: 访客姓名,    类型: string,          必填: 是, 来源: 用户, 约束: "长度 2-30，去除首尾空格后判空" }
      - { 名: 访客手机号,  类型: string,          必填: 是, 来源: 用户, 约束: "中国大陆手机号 11 位数字，1 开头；仅存数字串，不做脱敏存储" }
      - { 名: 被访人id,    类型: ref(员工),       必填: 是, 来源: 用户, 说明: 存员工 id，不复制姓名（员工改名时不漂移） }
      - { 名: 来访事由,    类型: string(长),      必填: 是, 来源: 用户, 约束: "长度 2-200；用户未给出枚举，故不做枚举（枚举化见待确认）" }
      - { 名: 备注,        类型: string(长),      必填: 否, 来源: 用户, 约束: "长度 0-200" }
      - { 名: 状态,        类型: "enum[待接待确认,已确认接待,已拒绝接待,已离场,已取消]", 必填: 是, 来源: 系统 }
      - { 名: 登记人id,    类型: ref(员工),       必填: 是, 来源: 系统, 说明: 当前登录的前台账号，用于审计 }
      - { 名: 登记时间,    类型: datetime,        必填: 是, 来源: 系统, 约束: "ISO 8601 带时区，如 2026-09-21T13:00:00+08:00" }
      - { 名: 确认时间,    类型: datetime,        必填: 否, 来源: 系统, 说明: 被访人做出接待决定的时间 }
      - { 名: 离场时间,    类型: datetime,        必填: 否, 来源: 系统, 说明: "由「登记离场」动作写入；该动作是否要保留见待确认" }
      - { 名: 版本号,      类型: integer,         必填: 是, 来源: 系统, 说明: "乐观并发控制，每次写入 +1；客户端以 If-Match 提交，冲突返回 409" }

  - 名: 接待确认
    说明: 被访人对某次来访登记做出的接待决定，每次决定留一条记录（可多条，便于记录拒绝后重新确认的历史）。
    字段:
      - { 名: id,         类型: string,   必填: 是, 来源: 系统 }
      - { 名: 登记id,     类型: ref(来访登记), 必填: 是, 来源: 系统 }
      - { 名: 确认结果,   类型: "enum[同意接待,拒绝接待]", 必填: 是, 来源: 用户 }
      - { 名: 拒绝原因,   类型: string(长), 必填: 条件必填, 来源: 用户, 约束: "确认结果 == 拒绝接待 时必填，长度 2-200；同意接待 时必须为空" }
      - { 名: 确认人id,   类型: ref(员工), 必填: 是, 来源: 系统, 说明: 当前登录账号，须等于该登记的 被访人id（见不变量 INV-04） }
      - { 名: 确认时间,   类型: datetime,  必填: 是, 来源: 系统, 约束: "ISO 8601 带时区" }

  - 名: 员工
    说明: 被访人候选与登录账号的承载实体。本站原型只引用其 id 与可读名，不定义人事字段。
    字段:
      - { 名: id,     类型: string, 必填: 是, 来源: 系统 }
      - { 名: 姓名,   类型: string, 必填: 是, 来源: 系统, 说明: "供选择器展示与被访人识别" }
      - { 名: 手机号, 类型: string, 必填: 否, 来源: 系统, 说明: "用于向被访人推送待确认提醒，推送渠道见待确认" }
    备注: 本原型不涉及组织架构、上级关系；员工数据来源（HR 系统同步 / 后台维护）见待确认。

# ---------------------------------------------------------------- 关系
关系:
  - { 名: 登记_被访人, 类型: 引用(ref), 从: 来访登记.被访人id, 到: 员工, 说明: 一个人可作为被访人关联多条登记 }
  - { 名: 登记_登记人, 类型: 引用(ref), 从: 来访登记.登记人id, 到: 员工, 说明: 前台账号，审计用 }
  - { 名: 登记_确认,   类型: 一对多,   从: 来访登记, 到: 接待确认, 实现: 接待确认.登记id, 说明: 允许同一登记产生多条确认记录（拒绝→再确认） }

# ---------------------------------------------------------------- 状态机
状态机:
  实体: 来访登记
  初始态: 待接待确认
  状态:
    - { 名: 待接待确认, 含义: 前台已登记，等待被访人做出接待决定, 终态: 否 }
    - { 名: 已确认接待, 含义: 被访人同意接待（尚未离场）, 终态: 否 }
    - { 名: 已拒绝接待, 含义: 被访人拒绝接待，拒绝原因已记录, 终态: 否 }
    - { 名: 已离场,     含义: 访客离开，本次来访结束, 终态: 是 }
    - { 名: 已取消,     含义: 登记作废（前台登记错误等），本次来访不成立, 终态: 是 }
  迁移:
    - { 从: 待接待确认, 到: 已确认接待, 触发: 被访人「同意接待」, 写字段: "确认时间", 需记录: 接待确认 }
    - { 从: 待接待确认, 到: 已拒绝接待, 触发: "被访人「拒绝接待」（须填拒绝原因）", 写字段: "确认时间", 需记录: 接待确认 }
    - { 从: 已确认接待, 到: 已离场,     触发: "前台「登记离场」", 写字段: "离场时间", 需记录: 否, 备注: 该迁移是否保留见待确认 }
    - { 从: 待接待确认, 到: 已取消,     触发: "前台「取消登记」", 写字段: "—", 需记录: 否, 备注: 取消权限范围见待确认 }
  禁止迁移:
    - "已确认接待 → 已拒绝接待（走过决定就不可反悔；要反悔需前台另起新登记）"
    - "已拒绝接待 → 已确认接待（同上）"
    - "已离场 / 已取消 → 任意状态（终态不可回退）"

# ---------------------------------------------------------------- 不变量
不变量:
  - id: INV-01
    规则: "拒绝原因：确认结果 == 拒绝接待 时必填且长度 ≥ 2；确认结果 == 同意接待 时必须为空。"
    层级: 服务端 + 表单（服务端为准）
  - id: INV-02
    规则: "同一登记id 在同一时刻只能有一条「生效」的接待确认；重复提交相同决定返回首次结果，不产生第二条记录（幂等）。"
    层级: 服务端
  - id: INV-03
    规则: "状态为 待接待确认 的登记才允许产生接待确认；状态已变更时提交返回 409。"
    层级: 服务端
  - id: INV-04
    规则: "接待确认只能由该登记的 被访人id 本人提交；其他账号（含登记该条的前台）提交返回 403。"
    层级: 服务端
    备注: "「前台不得代被访人确认」是依据 SEPARATION 常识推出的，用户未明确，列入待确认。"
  - id: INV-05
    规则: "访客手机号在单条登记内只做格式校验，不要求全局唯一——同一人可多次来访，每次一条登记。"
    层级: 服务端
    备注: 用户未说明是否需要「同一手机号当天重复登记」提示，列入待确认。
  - id: INV-06
    规则: "访客姓名与访客手机号在状态进入 已确认接待 后不可修改（被访人据以判断的是登记时的身份信息）。"
    层级: 服务端
    备注: 用户未说明是否允许事后更正，列入待确认。
  - id: INV-07
    规则: "写入接口必须携带版本号（If-Match）；版本不匹配返回 409，禁止静默覆盖。"
    层级: 服务端

# ---------------------------------------------------------------- 数据范围 / 可见性
数据范围:
  - { 角色: 前台, 可见: "可创建登记；可查看与操作总部/本人值班范围内的登记（范围口径见待确认）", 不可见: "无权查看他人站点登记（若启用多站点）" }
  - { 角色: 被访人, 可见: "仅可见被访人id 为自己的登记与其确认记录", 可操作: "在 待接待确认 状态下做接待决定" }
  - { 角色: 访客, 可见: "无账号，不登录系统" }

# ---------------------------------------------------------------- 待确认（用户未陈述，不猜）
待确认:
  - id: Q1
    问题: "被访人如何指定？从员工花名册选择（ref），还是前台手工填写被访人姓名与电话？"
    本原型假设: "从员工花名册选择，存 被访人id（ref(员工)）"
    影响: "决定「谁有权确认接待」能否被系统判定；若为手填文本，INV-04 无法校验。"
  - id: Q2
    问题: "被访人拒绝接待后，这条登记是终止（保持 已拒绝接待 等待前台处置），还是允许被访人反悔改确认、或前台改指被访人后重新发起？"
    本原型假设: "拒绝即终止为 已拒绝接待，不可反悔；重新走流程须另起一条登记"
    影响: "影响状态机是否需要在 已拒绝接待 上开返向边。"
  - id: Q3
    问题: "被访人长时间不确认怎么办？是否需要超时（如 30 分钟）自动提醒、升级到其上级、或自动放行？"
    本原型假设: "未实现超时；登记可长期停留在 待接待确认（这是当前的流程卡点）"
    影响: "无超时会导致待办永久堆积，见 03 流程文件「超时」章节。"
  - id: Q4
    问题: "是否需要记录来访时间区间（预计到达 / 实际到达 / 离场），并据此做访客统计？"
    本原型假设: "只记 登记时间 / 确认时间 / 离场时间"
    影响: "影响是否增加 预计到达时间 字段与看板口径。"
  - id: Q5
    问题: "被访人接到提醒的方式是什么（系统待办 / 短信 / 企业 IM）？"
    本原型假设: "原型只写「产生待办」，不指定推送渠道"
    影响: "影响是否引入 通知渠道 配置与外部依赖。"
  - id: Q6
    问题: "访客手机号是否需要脱敏展示（如 138****5678）、是否需要短信验证、是否需证件号登记？"
    本原型假设: "仅存明文手机号，格式校验，不做验证与脱敏"
    影响: "涉及个人信息处理与合规，须由业务方明确，不得由实现方默认。"
  - id: Q7
    问题: "前台能否代被访人确认接待（如被访人口头同意）？"
    本原型假设: "不能（INV-04）；前台只能登记与离场"
    影响: "若业务上确实需要代确认，须补一条「代确认」记录类型并留痕代确认人。"
  - id: Q8
    问题: "是否需要多站点 / 多前台岗位区分，以及班次交接？"
    本原型假设: "单一前台权限，不做站点划分"
    影响: "影响数据范围与是否需要 站点 实体。"
  - id: Q9
    问题: "登记单号生成规则（前缀、日期、流水位数）与是否需要按站点分段？"
    本原型假设: "V-YYYYMMDD-####，全局每日流水"
    影响: "影响单号唯一性与对外引用稳定性。"
  - id: Q10
    问题: "数据保留期限（来访记录留存多久、是否需要到期删除）？"
    本原型假设: "未定义保留期，永久保留"
    影响: "涉及个人信息合规，须业务方给定。"
