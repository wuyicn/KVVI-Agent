# KVVI 原型 | 03 流程：接待确认
# 数据模型：01-数据模型.yml（状态机源自「来访登记」）
# 本流程只做一件事：把「待接待确认」这一状态迁移落到具体的人。
# 状态机由数据模型定义，本文件只负责「谁能推、什么条件推、推完写什么」。

流程: 接待确认
绑定实体: 来访登记
触发: "表单「来访登记」提交成功（前台点「登记并通知被访人」）"
流程实例粒度: 一条来访登记 = 一个流程实例

# ---------------------------------------------------------------- 节点
节点:
  - id: n1
    类型: 开始
    名称: 前台登记来访
    触发: "前台提交 02-表单/来访登记"
    产出: "来访登记 状态=待接待确认，生成 登记单号 与 登记时间"
  - id: n2
    类型: 审批
    名称: 被访人确认接待
    语义: "被访人对本次来访做出接待决定：同意接待 / 拒绝接待"
    审批人:
      策略: 字段指定
      字段: 被访人id
      解析规则: "取本条来访登记的 被访人id，作为唯一有权处理的账号"
    收敛: 不适用（单人决定，非多人会签/或签）
    可填意见:
      - { 结果: 同意接待, 意见: 拒绝原因字段必须为空，不接受任何文本 }
      - { 结果: 拒绝接待, 意见: 拒绝原因必填（2-200 字），即 INV-01 }
    超时: "见下方「超时」章节（本原型未实现自动超时，登记会停留在此节点）"
  - id: n3
    类型: 自动动作
    条件: "n2 结果为 同意接待"
    动作:
      - "置 来访登记.状态 = 已确认接待"
      - "写 来访登记.确认时间 = 当前时间（ISO 8601 带时区）"
      - "新增 接待确认 记录：确认结果=同意接待，确认人id=n2 解析人，拒绝原因=空"
      - "通知前台：本条来访已同意接待，可安排进入"
      - "来访登记.版本号 +1"
  - id: n4
    类型: 自动动作
    条件: "n2 结果为 拒绝接待"
    动作:
      - "置 来访登记.状态 = 已拒绝接待"
      - "写 来访登记.确认时间 = 当前时间"
      - "新增 接待确认 记录：确认结果=拒绝接待，确认人id=n2 解析人，拒绝原因=被访人填写内容"
      - "通知前台：本条来访被拒绝，原因见拒绝原因"
      - "来访登记.版本号 +1"
  - id: n5
    类型: 结束
    名称: 流程结束
    终态: "已确认接待 或 已拒绝接待"
    说明: "两个终态都是本流程的收敛点；后续「进入 → 离场」不是本流程的职责，见下方「流程外动作」。"

# ---------------------------------------------------------------- 边
边:
  - { 从: n1, 到: n2, 说明: "登记即产生被访人待办" }
  - { 从: n2, 结果: 同意接待, 到: n3 }
  - { 从: n2, 结果: 拒绝接待, 到: n4, 约束: "需填意见=是（拒绝原因）" }
  - { 从: n3, 到: n5 }
  - { 从: n4, 到: n5 }

# 说明：本流程内部没有条件分支节点——用户没有提出「按金额/按类型走不同审批人」
#       这类分流规则。不无中生有地加条件节点。若有分流需求，见 99-交付说明 待确认 Q3。

# ---------------------------------------------------------------- 驳回
驳回:
  语义: "被访人拒绝接待 = 现有唯一一种否定结果，它不回到上一节点，而是直接进入终态 已拒绝接待。"
  目标态: 已拒绝接待
  必须填意见: 是（拒绝原因，2-200 字）
  驳回后能否重新提交:
    本原型: "否。要重新接待须由前台另起一条新登记（状态机禁止 已拒绝接待 → 已确认接待）"
    理由: "用户只说「被访人可以拒绝（要填原因）」，没说拒绝后能否反悔；反悔语义见 99-交付说明 Q2。"
  重新提交路径（若 Q2 确认允许改派被访人）:
    - "前台新建一条登记，被访人填新的人；旧登记保持 已拒绝接待 作为历史留痕，不覆盖、不删除。"
    - "严禁直接 UPDATE 旧登记的被访人id —— 那会让「谁拒绝了」这件事无法追溯。"

# ---------------------------------------------------------------- 撤回
撤回:
  发起人撤回: "本流程的「发起人」是前台，但进入 n2 后登记已是既成事实，不允许前台撤回（撤回会让被访人的待办凭空消失）。"
  是否允许: 否
  替代动作: "前台可执行「取消登记」把状态置为 已取消 —— 这是独立动作、独立留痕，不是撤回。"
  待确认: "Q4 —— 前台能否取消、什么状态下能取消（仅 待接待确认 时？），用户未说明。"

# ---------------------------------------------------------------- 超时
超时:
  当前实现: 无
  后果: "被访人不处理时，登记会永久停留在 待接待确认；这是本原型已知的流程卡点，不是遗漏。"
  建议方案（需业务确认后启用）:
    - { 时长: 15m, 动作: 提醒被访人一次（渠道见 01 文件 Q5） }
    - { 时长: 2h, 动作: "再次提醒被访人，并在前台列表把该条标为「等待超时」" }
    - { 时长: 当日 24:00, 动作: "自动置 已取消 或 升级被访人上级 —— 二者语义完全不同，必须由业务方选定，本原型不预设" }
  为什么不默认自动通过: "自动放行等于让访客在无人接待的情况下进门，属于安全决策，实现方无权默认。"

# ---------------------------------------------------------------- 审批人解析的兜底
兜底:
  规则:
    - 情形: "被访人id 对应的员工已离职 / 账号停用"
      动作: "n2 无法解析可处理人 → 不静默卡住；把该单标为「待前台处理」，通知前台改派被访人或取消登记，并记 追踪id"
    - 情形: "被访人id 指向的账号不存在"
      动作: "拒绝创建登记（不能在入口处留下一个永远无人确认的单）"
    - 情形: "被访人账号存在但长期不响应"
      动作: "见「超时」章节；当前仅前台侧可见，无自动升级"
  通用原则: "审批人解析失败必须有去处：转交、改派或告警，绝不允许流程静默卡死。"

# ---------------------------------------------------------------- 权限与可见性
权限:
  可发起: "前台（登录账号在「前台」角色内）"
  可操作 n2 审批节点: "仅 被访人id 指向的账号本人；其他任何角色不可代操作（含登记该条的前台），违反返回 403 —— 对应 INV-04，依据见 99-交付说明 Q7。"
  非参与者可见性:
    - { 角色: 前台, 可见: "本条登记全字段与其确认结果（含拒绝原因）", 可操作: "仅 登记 / 取消 / 登记离场" }
    - { 角色: 被访人, 可见: "被访人是自己的登记（含事由、备注）", 可操作: "仅 n2 一次接待决定" }
    - { 角色: 其他员工, 可见: "不可见（来访信息含访客手机号，属个人信息，不做公开）" }
  审批意见可见性: "拒绝原因对前台与被访人可见；是否对第三人（如行政主管）可见见 99-交付说明 Q8。"

# ---------------------------------------------------------------- 审计与幂等
审计:
  - "每次接待决定产生一条 接待确认 记录（不做就地覆盖），拒绝→重来的历史可查。"
  - "确认人id 取登录态，不由请求体传入 —— 请求体带确认人一律忽略。"
  - "错误的权限尝试（非被访人提交确认）同样写审计日志。"
幂等:
  - "POST /来访登记/{id}/同意接待 与 /拒绝接待 均须幂等：同一登记重复提交相同结果返回 200 与首次相同响应，不产生第二条 接待确认 记录。"
  - "并发：两个结果同时到达时以版本号（If-Match）判定，先到者生效，后到者返回 409 并提示「该来访已由被访人处理」。"

# ---------------------------------------------------------------- 测试示例
测试示例:
  - 场景: 正常接待
    输入: "登记 A（被访人=员工E），员工E 提交 同意接待"
    期望路径: "n1 → n2 → n3 → n5"
    期望结果: "状态=已确认接待；确认时间已写；接待确认 记录 1 条，拒绝原因为空；前台收到通知"
  - 场景: 拒绝接待
    输入: "登记 A，员工E 提交 拒绝接待，拒绝原因=「当日外出，无法接待」"
    期望路径: "n1 → n2 → n4 → n5"
    期望结果: "状态=已拒绝接待；拒绝原因已记录；前台收到通知"
  - 场景: 拒绝但未填原因（边界）
    输入: "登记 A，员工E 提交 拒绝接待，拒绝原因=空"
    期望结果: "422 校验失败，字段错误 指出「拒绝原因」必须填写；状态不变（仍为 待接待确认），不产生 接待确认 记录"
  - 场景: 同意却填了原因（边界）
    输入: "登记 A，员工E 提交 同意接待，拒绝原因=「好的」"
    期望结果: "422 校验失败，提示 同意接待 时不能填拒绝原因；或按实现约定静默丢弃该字段 —— 二者选一必须明确，本原型取前者（拒绝，不静默吞掉用户输入）"
  - 场景: 非被访人代确认（权限边界）
    输入: "登记 A 被访人=员工E，前台账号 F 提交 同意接待"
    期望结果: "403；状态不变；写审计日志"
  - 场景: 重复提交 / 幂等
    输入: "员工E 对登记 A 连续提交两次 同意接待"
    期望结果: "第一次 200 并落记录；第二次返回与第一次相同的 200 响应，接待确认 记录仍只有 1 条"
  - 场景: 状态已变更后再确认（并发边界）
    输入: "员工E 先提交 拒绝接待；随后提交 同意接待"
    期望结果: "第二次返回 409「当前状态为 已拒绝接待，不可再确认」；状态不变"
  - 场景: 被访人已离职（兜底）
    输入: "登记 A 被访人=员工E，员工E 在确认前被停用"
    期望结果: "该单标为「待前台处理」，前台收到通知；不静默停留、不自动通过"

# ---------------------------------------------------------------- 流程外动作（明确不属本流程）
流程外动作:
  - { 名称: 登记离场, 谁做: 前台, 前置状态: 已确认接待, 结果: 状态=已离场, 备注: "是否保留此动作见 99-交付说明 Q5（用户只提到登记与确认两件事）" }
  - { 名称: 取消登记, 谁做: 前台, 前置状态: 待接待确认, 结果: 状态=已取消, 备注: "见 99-交付说明 Q4" }

# ---------------------------------------------------------------- 接口绑定
接口绑定:
  清单:
    - { 动作: 同意接待, 方法: POST, 路径: "/来访登记/{id}/同意接待", 权限: "被访人本人", 幂等: "已确认接待时重复调用返回 200 同一结果", 请求: "{ 意见: string（本原型不允许非空） }", 响应: "{ 200: 来访登记详情, 403: 非被访人本人, 409: 状态已变更 }" }
    - { 动作: 拒绝接待, 方法: POST, 路径: "/来访登记/{id}/拒绝接待", 权限: "被访人本人", 幂等: "同上", 请求: "{ 拒绝原因: string（必填 2-200） }", 响应: "{ 200: 来访登记详情, 422: 拒绝原因为空, 403: 非被访人本人, 409: 状态已变更 }" }
    - { 动作: 我的待确认列表, 方法: GET, 路径: "/来访登记", 查询: "{ 待我确认: true, 游标: string, 每页: 20 }", 响应: "{ 数据: array<来访登记摘要>, 分页: {下一页游标} }" }
  通用约定:
    - "状态变更一律走动作端点，禁止用 PATCH /来访登记/{id} 直接写 状态 —— 那会绕过 INV-03、INV-04 与审计。"
    - "时间一律 ISO 8601 带时区；id 为不透明字符串。"
    - "统一错误体：{ 错误码, 消息, 字段错误[], 追踪id }。"
