# KVVI 原型 | 02 表单：来访登记
# 数据模型：01-数据模型.yml（实体「来访登记」）
# 使用者：前台。前台在访客到达现场时，边问边填，30 秒内应能填完。
# 设计取舍：字段顺序按前台的询问顺序排（先问人、再问找谁、最后问为什么），
#           不按表结构排；系统生成字段一律不进输入区。

表单: 来访登记
实体: 来访登记
入口: "前台工作台 → 「登记来访」"
布局: 单列，labelPosition=top（前台视线自上而下，不左右横跳）
提交按钮文案: 登记并通知被访人

# ---------------------------------------------------------------- 分组
分组:
  - 标题: 访客信息
    说明: 先确认「来的是谁」。姓名与手机号是后续追溯的唯一凭据，故必填。
    字段:
      - 名: 访客姓名
        模型字段: 访客姓名
        类型: string
        控件: 单行输入
        必填: 是
        占位: 请填写访客本人姓名
        校验:
          - { 时机: 即时, 规则: "去首尾空格后长度 2-30", 消息: "访客姓名请填写 2-30 个字" }
          - { 时机: 提交, 规则: "非空", 消息: "请填写访客姓名" }
      - 名: 访客手机号
        模型字段: 访客手机号
        类型: string
        控件: 单行输入（输入框限制为数字键盘，maxlength=11）
        必填: 是
        占位: 11 位手机号
        校验:
          - { 时机: 即时, 规则: "正则 ^1[3-9]\\d{9}$", 消息: "手机号请填写 11 位数字，以 1 开头" }
          - { 时机: 服务端, 规则: "去空格去横线后仍须匹配 ^1[3-9]\\d{9}$", 消息: "手机号格式不正确" }

  - 标题: 来访对象
    说明: 决定谁收到接待待办，也是「谁能确认接待」的判定依据。
    字段:
      - 名: 被访人
        模型字段: 被访人id
        类型: ref(员工)
        控件: 实体选择器（可搜索，按姓名匹配，选中后显示姓名 + 手机号后四位）
        必填: 是
        取值: "存员工 id；页面展示用员工姓名"
        校验:
          - { 时机: 提交, 规则: "必须存在于员工花名册且在职", 消息: "请选择一位在职的被访人" }
        待确认: "Q1 —— 若业务现实是「访客只说得出被访人姓名、不能在花名册里找到人」，则改为手工填写被访人姓名 + 手机号，并接受 INV-04（仅被访人本人可确认）无法校验的后果。"

  - 标题: 来访事由
    说明: 被访人凭这一条判断是否接待，必须由前台如实填写，故必填。
    字段:
      - 名: 来访事由
        模型字段: 来访事由
        类型: string(长)
        控件: 多行输入（3 行）
        必填: 是
        占位: 例如：洽谈 XX 项目合作 / 送货 / 面试 / 设备维修
        校验:
          - { 时机: 即时, 规则: "长度 2-200", 消息: "来访事由请填写 2-200 个字" }
          - { 时机: 提交, 规则: "非空", 消息: "请填写来访事由，被访人需要据此判断是否接待" }
      - 名: 备注
        模型字段: 备注
        类型: string(长)
        控件: 多行输入（2 行）
        必填: 否
        占位: 选填，例如同行人数、车牌号
        校验:
          - { 时机: 即时, 规则: "长度 0-200", 消息: "备注请控制在 200 字以内" }

# ---------------------------------------------------------------- 只读展示区（不进输入区）
只读区:
  说明: 系统生成字段在表单顶部以「登记信息」区块只读展示，用户不可编辑、不参与提交。
  字段:
    - { 名: 登记单号, 值: "保存后生成（示例 V-20260921-0007）", 展示时机: 保存成功后 }
    - { 名: 登记人,   值: "当前登录的前台账号姓名",       展示时机: 始终 }
    - { 名: 登记时间, 值: "系统当前时间",                 展示时机: 保存成功后 }
    - { 名: 状态,     值: "待接待确认",                  展示时机: 保存成功后 }

# ---------------------------------------------------------------- 条件显隐
条件显隐:
  规则:
    - { 字段: 备注, 显隐: 始终可见, 必填: 否 }
  规则说明: >
    本表单自身没有互斥字段（拒绝原因是「接待确认」表单的字段，不在本表单）。
    若后续按 Q1 改为手填被访人姓名/电话，则新增的「被访人手机号」字段
    显隐 = 被访人姓名非空，且被访人姓名清空时必须同时清空被访人手机号，
    严禁带着用户看不见的脏数据提交。

# ---------------------------------------------------------------- 校验汇总
校验:
  即时（失焦触发）:
    - 访客姓名长度
    - 访客手机号格式
    - 来访事由 / 备注长度
  提交（点「登记并通知被访人」时一次性列出全部问题）:
    - 全部必填项非空
    - 被访人在职存在性（这一条实际由服务端判定，前端仅呈现）
  服务端（落库前，客户端校验不作数）:
    - 手机号规范化后格式校验（strip 空格与 -）
    - 被访人 ref 存在且在在职名单内
    - 访客姓名/手机号长度与字符集
    - 按 INV-05：手机号不查全库唯一（同一人可多次来访）
  错误呈现: "一次性列出全部错误，每条错误挂在对应字段下方；文案说「怎么改」，不说「校验失败」。"

# ---------------------------------------------------------------- 提交动作
提交动作:
  1: "前端收集：访客姓名、访客手机号、被访人id、来访事由、备注"
  2: "调用 POST /来访登记（幂等：Idempotency-Key 必填，避免前台连点产生两条重复登记）"
  3: "服务端生成 登记单号 / 登记时间 / 登记人id，状态置为「待接待确认」（按状态机，不由客户端指定）"
  4: "成功后：本条登记出现在前台列表顶部，并显示「已通知被访人（待确认）」"
  5: "同时触发 03-流程文件 的接待确认流程，向被访人产生一条待办"
  失败处理:
    - { 情形: 422 校验失败, 动作: "把 字段错误 逐条回填到对应字段下方，不清空用户已填内容" }
    - { 情形: 409 重复提交（Idempotency-Key 命中）, 动作: "返回首次创建结果，提示「该来访已登记，单号为 …」，不新建" }
    - { 情形: 500, 动作: "提示「登记失败，请重试」，展示 追踪id 便于对日志" }

# ---------------------------------------------------------------- 表单自身的规则（不猜）
表单不做的判断:
  - "不在前端校验「被访人今天是否已有多条待确认来访」——用户未提出该限制，不做静默限流。"
  - "不自动合并同一访客的多次来访——同一手机号多次来访就是多条登记（INV-05）。"
  - "不要求访客出示证件、不上传照片——用户未提出（见 01 文件 Q6）。"

# ---------------------------------------------------------------- 与接口的绑定
接口绑定:
  - { 动作: 创建登记, 方法: POST, 路径: /来访登记, 幂等: "Idempotency-Key 必填", 响应: "201 返回登记详情（含 登记单号、状态、版本号）" }
  - { 动作: 被访人候选查询, 方法: GET, 路径: /员工, 查询: "{ 关键词: string, 在职: true, 每页: 20 }", 响应: "{ 数据: [{id, 姓名, 手机号后四位}], 分页: {下一页游标} }" }
  - { 动作: 前台在办登记列表, 方法: GET, 路径: /来访登记, 查询: "{ 状态: enum, 登记日期: date, 游标: string, 每页: 20 }", 响应: "{ 数据: array<来访登记摘要>, 分页: {下一页游标} }", 排序: "登记时间 desc, id desc（稳定排序，避免翻页重复或漏行）" }
