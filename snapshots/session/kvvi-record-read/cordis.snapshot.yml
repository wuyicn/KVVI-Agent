# Replay patch shared by the ordinary headless snapshot composition. The model
# script comes from the scenario's committed session JSONL.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro
          - id: deepseek-messages
            name: DeepSeek Messages
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- insert:
    - id: kvvi-platform-fixture
      name: './platform-fixture.mjs'
    - id: tool-kvvi-business
      name: '@deepseek-ai/dsh-tool-kvvi-business'
      inject: [kvviModeRouter]
      config:
        platformUrl: !!js ctx.kvviModeRouter.platformUrl
        contextSecret: isolated-snapshot-secret

- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  inject: [kvviModeRouter]
  config:
    personaPrefix: !!js ctx.kvviModeRouter.workerPrefix

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tool-jobs
  disabled: true

- id: tool-fs
  disabled: true

- id: tool-fs-search
  disabled: true

- id: tool-skill
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: tool-workflow
  disabled: true

- id: tool-todo
  disabled: true

- id: tool-goal
  disabled: true

- id: tool-ralph
  disabled: true

- id: tool-web
  disabled: true

- id: plan-mode
  disabled: true
