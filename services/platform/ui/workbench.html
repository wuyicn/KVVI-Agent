<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KVVI 工作台</title>
<style>
  :root{
    --fg:#111827; --muted:#6b7280; --faint:#9ca3af;
    --line:#e8eaed; --line2:#f3f4f6; --bg:#f5f6f8; --card:#fff;
    --accent:#2f6bff; --accent-dark:#1f4fd0; --accent-soft:#eef3ff;
    --ok-bg:#ecfdf5; --ok-fg:#166534; --warn-bg:#fffbeb; --warn-fg:#92400e;
    --bad-bg:#fef2f2; --bad-fg:#991b1b;
    --radius:14px;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
    font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased;
  }
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input{font:inherit}
  a{color:var(--accent)}

  /* ══ 登录 ═══════════════════════════════════════════════════ */
  #login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
  .loginbox{
    width:100%;max-width:390px;background:var(--card);border:1px solid var(--line);
    border-radius:18px;padding:34px 32px 28px;box-shadow:var(--shadow);
  }
  .mark{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);
    display:flex;align-items:center;justify-content:center;margin-bottom:16px;
    font-weight:800;color:var(--accent);font-size:17px;letter-spacing:-.5px}
  .loginbox h1{margin:0 0 6px;font-size:20px;letter-spacing:.2px}
  .loginbox .lead{color:var(--muted);font-size:13px;margin-bottom:26px}
  .field{margin-bottom:15px}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:7px;font-weight:500}
  .field input{
    width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:10px;
    background:#fff;outline:none;transition:border-color .12s,box-shadow .12s;
  }
  .field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,107,255,.13)}
  .btn{width:100%;padding:11px 16px;border-radius:10px;background:var(--accent);
    color:#fff;font-weight:600;transition:background .12s}
  .btn:hover:not(:disabled){background:var(--accent-dark)}
  .btn:disabled{opacity:.55;cursor:progress}
  #loginMsg{margin-top:15px;font-size:12.5px;min-height:20px;line-height:1.6}
  .msg-bad{color:var(--bad-fg)}
  .msg-ok{color:var(--ok-fg)}
  .msg-dim{color:var(--muted)}
  #companyPick{margin-top:10px}
  #companyPick button{display:block;width:100%;margin-top:8px;padding:10px 13px;text-align:left;
    background:#fff;border:1px solid var(--line);border-radius:10px;transition:border-color .12s,background .12s}
  #companyPick button:hover{border-color:var(--accent);background:var(--accent-soft)}
  .loginfoot{margin-top:22px;padding-top:16px;border-top:1px solid var(--line2);
    font-size:11.5px;color:var(--faint);line-height:1.7}

  /* ══ 工作台 ═════════════════════════════════════════════════ */
  #app{display:none;min-height:100%}
  header{
    background:var(--card);border-bottom:1px solid var(--line);
    padding:0 26px;height:58px;display:flex;align-items:center;gap:12px;
    position:sticky;top:0;z-index:10;
  }
  .brand{display:flex;align-items:baseline;gap:9px}
  .brand strong{font-size:15px;font-weight:700;letter-spacing:.2px}
  .brand span{font-size:11.5px;color:var(--faint)}
  header .spacer{flex:1}
  .who{text-align:right;line-height:1.35}
  .who .n{font-size:13px;font-weight:600}
  .who .c{font-size:11.5px;color:var(--muted)}
  .ghost{padding:6px 12px;border:1px solid var(--line);border-radius:8px;
    font-size:12.5px;color:var(--muted);transition:border-color .12s,color .12s}
  .ghost:hover{border-color:var(--faint);color:var(--fg)}

  main{padding:26px 26px 72px;max-width:1080px;margin:0 auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px 24px;box-shadow:var(--shadow)}
  .card.wide{grid-column:1/-1}
  .card h2{margin:0 0 3px;font-size:14.5px;display:flex;align-items:center;gap:8px}
  .card .hint{color:var(--muted);font-size:12px;margin-bottom:18px}

  .kv{display:flex;justify-content:space-between;gap:16px;padding:9px 0;
    border-top:1px solid var(--line2);font-size:13px}
  .kv:first-of-type{border-top:none}
  .kv .k{color:var(--muted);flex:0 0 auto}
  .kv .v{font-weight:600;text-align:right;word-break:break-all}
  .kv .v.mono{font-weight:500;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--muted)}

  .capgroup{margin-top:16px}
  .capgroup:first-of-type{margin-top:0}
  .capgroup .gt{font-size:11.5px;color:var(--faint);font-weight:600;letter-spacing:.4px;
    text-transform:uppercase;margin-bottom:9px}
  .caps{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
  .cap{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fcfcfd}
  .cap .ct{font-size:13px;font-weight:600}
  .cap code{display:block;margin-top:3px;font-size:10.5px;color:var(--faint);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}

  .badge{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:999px;font-weight:600}
  .badge.ok{background:var(--ok-bg);color:var(--ok-fg)}
  .badge.warn{background:var(--warn-bg);color:var(--warn-fg)}
  .badge.bad{background:var(--bad-bg);color:var(--bad-fg)}

  .empty{color:var(--muted);font-size:13px}
  .empty b{color:var(--fg)}
  .stub{border:1px dashed var(--line);border-radius:11px;padding:16px 18px;
    background:#fcfcfd;font-size:12.5px;color:var(--muted);line-height:1.8}
  .stub b{color:var(--fg)}
  .note{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);
    border-radius:var(--radius);padding:18px 22px;font-size:12.5px;line-height:1.95;color:var(--muted)}
  .note h2{margin:0 0 10px}
  .note b{color:var(--fg)}
  .note code{background:#f3f4f6;border-radius:5px;padding:1px 6px;font-size:11.5px;color:var(--fg);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .spinner{display:inline-block;width:13px;height:13px;border:2px solid var(--line);
    border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;
    vertical-align:-2px;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}

  @media (max-width:600px){
    header{padding:0 16px;height:auto;min-height:58px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
    main{padding:18px 16px 56px}
    .card{padding:18px 18px}
    .who{text-align:left}
  }
</style>
</head>
<body>

<!-- ══ 登录 ══════════════════════════════════════════════════ -->
<div id="login">
  <form class="loginbox" id="loginForm" autocomplete="on">
    <div class="mark">KV</div>
    <h1>KVVI 工作台</h1>
    <div class="lead">用你的账号登录，进入本职业务系统</div>

    <div class="field">
      <label for="loginInput">账号</label>
      <input id="loginInput" name="login" type="text" autocomplete="username"
             placeholder="请输入账号" required>
    </div>
    <div class="field">
      <label for="passwordInput">口令</label>
      <input id="passwordInput" name="password" type="password"
             autocomplete="current-password" placeholder="请输入口令" required>
    </div>

    <button class="btn" id="submitBtn" type="submit">登录</button>
    <div id="loginMsg" role="status" aria-live="polite"></div>
    <div id="companyPick"></div>

    <div class="loginfoot">
      KVVI 智能生成式应用搭建平台 V1.0<br>
      本页由 KVVI 自己的工作台提供，不是通用管理后台。
    </div>
  </form>
</div>

<!-- ══ 工作台 ════════════════════════════════════════════════ -->
<div id="app">
  <header>
    <span class="brand"><strong>KVVI 工作台</strong><span id="tagMode">工作模式</span></span>
    <span class="spacer"></span>
    <span class="who">
      <div class="n" id="whoName">—</div>
      <div class="c" id="whoCompany">—</div>
    </span>
    <button class="ghost" id="logoutBtn" type="button">退出</button>
  </header>

  <main>
    <div class="grid">

      <section class="card">
        <h2>本次登录</h2>
        <div class="hint">身份在会话创建时确定，本次登录期间不可切换公司</div>
        <div id="sessionBox"><span class="spinner"></span>读取中…</div>
      </section>

      <section class="card">
        <h2>我能做什么</h2>
        <div class="hint" id="capsHint">本模式下可用的能力，由身份层按会话给出</div>
        <div id="capsBox"><span class="spinner"></span>读取中…</div>
      </section>

      <section class="card">
        <h2>我的系统</h2>
        <div class="hint">搭建完成后发布到本公司的业务系统</div>
        <div id="appsBox"><div class="stub">尚未接通</div></div>
      </section>

      <section class="card">
        <h2>对话办理</h2>
        <div class="hint">工作模式下用自然语言表达意图</div>
        <div id="chatBox"><div class="stub">尚未接通</div></div>
      </section>

      <section class="note wide" id="aboutBox"></section>

    </div>
  </main>
</div>

<script>
'use strict';

const TOKEN_KEY = 'kvvi.workbench.token';
const $ = (id) => document.getElementById(id);

function esc(v){
  return String(v == null ? '' : v).replace(/[&<>"]/g, (c) =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
}

/** 后端错误码 → 人话。判据在服务端，这里只做呈现。 */
const MESSAGES = {
  KVVI_BAD_CREDENTIALS: '账号或口令不对。',
  KVVI_ACCOUNT_NOT_ACTIVE: '账号已停用，请联系管理员。',
  KVVI_NOT_A_MEMBER: '该账号不属于任何公司。',
  KVVI_BAD_GATEWAY: '入口类型不对 —— 工作台只接受员工入口。',
  KVVI_BAD_JSON: '请求格式错误。',
  KVVI_TOKEN_REQUIRED: '登录状态已失效，请重新登录。',
  KVVI_INVALID_TOKEN: '登录状态已失效，请重新登录。',
  KVVI_IDENTITY_UNAVAILABLE: '身份层暂时不可用，请稍后重试。',
  KVVI_COMPANY_SELECTION_REQUIRED: '这个账号属于多家公司，请选择本次要进入的公司。',
};

/**
 * 能力码 → 员工看得懂的话。
 *
 * ⚠️ 这里是**展示映射**，不是判据：判据在服务端的能力分类表（冻结常量）。
 * 认不出的码仍然渲染出来（带原码），不能因为没写文案就**少显示一项能力** ——
 * 界面少显示一项，读起来像「我没有这个权限」，而事实是「文案还没写」。
 */
const CAP_LABEL = {
  'data.readView':      { text: '查看记录',  group: '查看' },
  'data.aggregate':     { text: '看汇总',    group: '查看' },
  'biz.createRecord':   { text: '新建单据',  group: '办理' },
  'biz.updateRecord':   { text: '修改单据',  group: '办理' },
  'flow.submit':        { text: '提交审批',  group: '流程' },
  'flow.approve':       { text: '审批',      group: '流程' },
  'records.list':       { text: '查列表',    group: '查看' },
  'records.get':        { text: '看详情',    group: '查看' },
  'navigation.open_record': { text: '打开单据', group: '查看' },
  'options.list':       { text: '取选项',    group: '查看' },
};
const GROUP_ORDER = ['查看', '办理', '流程', '其他'];
function capOf(code){
  return CAP_LABEL[code] || { text: code, group: '其他' };
}

function say(text, kind){
  const el = $('loginMsg');
  el.className = kind ? 'msg-' + kind : '';
  el.textContent = text || '';
}

function getToken(){ return sessionStorage.getItem(TOKEN_KEY) || ''; }
function setToken(t){
  if (t) sessionStorage.setItem(TOKEN_KEY, t);
  else sessionStorage.removeItem(TOKEN_KEY);
}

/** 调平台的身份端点。**令牌只放在头里**，不放 URL 也不放 Cookie。 */
async function authFetch(path, options){
  const opts = Object.assign({ headers: {} }, options || {});
  const token = getToken();
  if (token) opts.headers.authorization = 'Bearer ' + token;
  if (opts.body !== undefined && typeof opts.body !== 'string') {
    opts.headers['content-type'] = 'application/json';
    opts.body = JSON.stringify(opts.body);
  }
  const res = await fetch(path, opts);
  let body = null;
  try { body = await res.json(); } catch (e) { body = null; }
  return { status: res.status, body };
}

/* ── 登录 ─────────────────────────────────────────────────────── */

async function doLogin(login, password, companyId){
  say('正在登录…', 'dim');
  $('submitBtn').disabled = true;
  $('companyPick').innerHTML = '';
  try {
    const body = { login, password, gateway: 'USER' };
    if (companyId) body.companyId = companyId;
    // 走 /auth/login 而不是 /workbench/api/... ：**登录端点只有一份**，
    // 工作台不复制身份逻辑，只消费它的结果。
    const r = await authFetch('/auth/login', { method: 'POST', body });
    if (r.status === 409 && r.body && r.body.error === 'KVVI_COMPANY_SELECTION_REQUIRED') {
      say(MESSAGES.KVVI_COMPANY_SELECTION_REQUIRED, 'dim');
      const box = $('companyPick');
      box.innerHTML = (r.body.companies || []).map((c) =>
        '<button type="button" data-company="' + esc(c.companyId) + '">'
        + esc(c.name || c.companyId) + '</button>').join('');
      Array.prototype.forEach.call(box.querySelectorAll('button'), (b) => {
        b.addEventListener('click', () =>
          doLogin(login, password, b.getAttribute('data-company')));
      });
      return;
    }
    if (r.status !== 201 || !r.body || !r.body.token) {
      const code = (r.body && r.body.error) || ('HTTP ' + r.status);
      say(MESSAGES[code] || ('登录失败：' + code), 'bad');
      return;
    }
    setToken(r.body.token);
    say('', '');
    await enterWorkbench();
  } catch (error) {
    say('网络错误：' + error, 'bad');
  } finally {
    $('submitBtn').disabled = false;
  }
}

$('loginForm').addEventListener('submit', (e) => {
  e.preventDefault();
  doLogin($('loginInput').value.trim(), $('passwordInput').value, null);
});

/* ── 工作台 ───────────────────────────────────────────────────── */

async function enterWorkbench(){
  const r = await authFetch('/workbench/api/session', { method: 'GET' });
  if (r.status === 401) {
    setToken('');
    showLogin('登录状态已失效，请重新登录。');
    return;
  }
  if (r.status !== 200 || !r.body) {
    showLogin('读取会话失败：' + ((r.body && r.body.error) || ('HTTP ' + r.status)));
    return;
  }
  renderSession(r.body);
  $('login').style.display = 'none';
  $('app').style.display = 'block';
}

function showLogin(message){
  $('app').style.display = 'none';
  $('login').style.display = 'flex';
  if (message) say(message, 'bad');
}

function renderSession(s){
  // 顶栏：显示**人和公司**，不是 uuid 片段。
  $('whoName').textContent = s.login || '（未命名账号）';
  $('whoCompany').textContent = s.companyName || ('公司 ' + String(s.companyId).slice(0, 8) + '…');
  $('tagMode').textContent = s.gateway === 'USER' ? '工作模式' : String(s.gateway);

  const rows = [
    ['公司', s.companyName
      ? esc(s.companyName) + ' <span style="color:var(--faint);font-weight:400">'
        + esc(String(s.companyId).slice(0, 8)) + '…</span>'
      : esc(s.companyId), false],
    ['账号', esc(s.login || s.userId), false],
    ['模式', '工作模式（员工入口）', '工作模式由入口决定，本会话内不可切换'],
    ['状态', s.state === 'ACTIVE'
      ? '<span class="badge ok">会话有效</span>'
      : '<span class="badge warn">' + esc(s.state) + '</span>', false],
    ['建立时间', esc(fmtTime(s.createdAt)), false],
    ['会话标识', esc(String(s.sessionId).slice(0, 8)) + '…', false],
  ];
  $('sessionBox').innerHTML = rows.map(function(r){
    return '<div class="kv"><span class="k">' + r[0] + '</span>'
      + '<span class="v' + (r[2] ? '' : '') + '"' + (r[2] ? ' title="' + esc(r[2]) + '"' : '')
      + '>' + r[1] + '</span></div>';
  }).join('');

  // 能力：按组渲染，标签用员工看得懂的话。
  const caps = s.capabilities || [];
  const box = $('capsBox');
  if (!caps.length) {
    box.innerHTML = '<div class="empty">身份层没有给出任何能力 —— 请联系管理员确认你的角色</div>';
  } else {
    const byGroup = {};
    caps.forEach(function(code){
      const c = capOf(code);
      (byGroup[c.group] = byGroup[c.group] || []).push({ code: code, text: c.text });
    });
    box.innerHTML = GROUP_ORDER.filter(function(g){ return byGroup[g]; }).map(function(g){
      return '<div class="capgroup"><div class="gt">' + esc(g) + '</div><div class="caps">'
        + byGroup[g].map(function(c){
          return '<div class="cap"><div class="ct">' + esc(c.text) + '</div>'
            + '<code>' + esc(c.code) + '</code></div>';
        }).join('')
        + '</div></div>';
    }).join('');
  }
  $('capsHint').textContent = '本模式下可用能力 ' + caps.length
    + ' 项，由身份层按会话给出（不是界面过滤的结果）';

  // 两块未接通的地方：说清**缺什么**，不写「敬请期待」。
  $('appsBox').innerHTML =
    '<div class="stub">业务系统列表要在<b>发布通道产出已发布版本</b>之后才有内容。'
    + '现在没有可列的东西，所以这里空着 —— 不是加载失败。</div>';
  $('chatBox').innerHTML =
    '<div class="stub">对话要接<b>运行时进程的 Agent 会话接口</b>，'
    + '而它与本页的身份体系是两套令牌，桥接还没做。'
    + '界面先留在这里，避免看起来「能用但点了没反应」。</div>';

  // 界面隔离：如实说明它为什么不在，而不是假装没这回事。
  const o = s.otherGatewayCapabilitiesOmitted;
  $('aboutBox').innerHTML =
    '<h2>这一页是什么</h2>'
    + 'KVVI 自己的工作台页面，由<b>平台服务进程</b>直接提供，不是通用管理后台，'
    + '也不是 DSH 自带界面的一部分。'
    + 'PRD §2.6.1 规定「模式由入口决定，不做会话内切换」，而只有平台进程知道'
    + '一个会话属于哪种模式，所以工作台挂在它上面。'
    + '<br><br>'
    + '<h2>为什么这里看不到搭建入口</h2>'
    + '不是把按钮藏起来了。本页读到的能力表里<b>本来就没有</b>搭建类能力'
    + (o
        ? '，而且省略是<b>声明过的</b>（响应里的 <code>otherGatewayCapabilitiesOmitted</code> 字段）'
          + '—— 所以「没带」与「漏带」可以区分。'
        : '。')
    + '界面拿不到的东西，渲染不出来。';

  function fmtTime(v){
    if (!v) return '—';
    const d = new Date(v);
    if (isNaN(d.getTime())) return String(v);
    const p = (n) => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate())
      + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
}

$('logoutBtn').addEventListener('click', async () => {
  try { await authFetch('/auth/logout', { method: 'POST' }); }
  catch (e) { /* 登出失败也要清本地，否则界面留在假登录态 */ }
  setToken('');
  showLogin('已退出。');
});

/* ── 启动 ─────────────────────────────────────────────────────── */
if (getToken()) enterWorkbench();
</script>
</body>
</html>
